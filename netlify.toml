  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/gaya-bebas.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# This asset is referenced with a versioned URL; preserve fast repeat visits.
[[headers]]
