[build]
  publish = "."
  # Laman statik: tidak memerlukan proses kompilasi.
  command = "echo 'Static website: no build required'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

# Scoped browser caching for the Bilik Antara hero art.
# The image URL is versioned in HTML + CSS to prevent stale updates.
[[headers]]
  for = "/bilik-antara-cover-art.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Versioned CSS and avatar resources may be reused on repeat visits.
# Every visual change must bump its ?v= query string in the referring HTML.
[[headers]]
  for = "/bilik-antara.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/bilik-antara-suite.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
