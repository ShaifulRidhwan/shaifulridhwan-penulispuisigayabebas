name: AKSARA Intelligence 3.0 production baseline (one time)
on:
  push:
    branches:
      - feat/aksara-intelligence-3-p1-p4
    paths:
      - .github/workflows/aksara-intelligence-3-live-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-live-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Current production only; five bounded checks, three synthetic AI messages
        run: node cloudflare/intelligence-3-production-baseline.mjs
