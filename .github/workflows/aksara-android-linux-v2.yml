name: AKSARA Linux V2 System Identity owner APK
on:
  push:
    branches:
      - feature/aksara-linux-control-deck-v2
    # Owner QA: identity and LIVE PTY independent glass cards, equal-width
    # command categories/actions, footer glass parity. Keyboard remains unchanged.
    # Auto-build only when this workflow changes. Subsequent source commits
    # do not consume CI until workflow_dispatch is explicitly requested.
    paths:
      - '.github/workflows/aksara-android-linux-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: aksara-linux-v2-arm64
  cancel-in-progress: true
jobs:
  build-linux:
    if: github.ref == 'refs/heads/feature/aksara-linux-control-deck-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      AKSARA_CI_COMPILER_REPOSITORY: /tmp/aksara-compiler-repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap checksum-pinned Gradle
        run: |
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/232373824' -o "$RUNNER_TEMP/aksara-gradle.zip"
          printf '%s  %s\n' '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78' "$RUNNER_TEMP/aksara-gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/aksara-gradle.zip" -d "$RUNNER_TEMP/aksara-gradle"
          echo "$RUNNER_TEMP/aksara-gradle/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Prepare verified compiler repository
        run: |
          compiler_dir="$AKSARA_CI_COMPILER_REPOSITORY/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.1.21"
          mkdir -p "$compiler_dir"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/JetBrains/kotlin/releases/assets/598630357' -o "$compiler_dir/kotlin-compiler-embeddable-2.1.21.jar"
          curl --fail --location --retry 3 'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.1.21/kotlin-compiler-embeddable-2.1.21.pom' -o "$compiler_dir/kotlin-compiler-embeddable-2.1.21.pom"
          printf '%s  %s\n' '67a2e3673765f097725608cc7c843b0d8fdd94bd9af41327211361614aa57d49' "$compiler_dir/kotlin-compiler-embeddable-2.1.21.jar" 'dbbf8ac2550d5b1ae2a627f204f28b16f9271e36c44d8994aa3b139cbf70e45a' "$compiler_dir/kotlin-compiler-embeddable-2.1.21.pom" | sha256sum --check
      - name: Verify shared Web/Android Brain contracts
        run: node scripts/sync-android-voice-brain.cjs --check
      - name: Restore existing Stockfish build
        id: stockfish-cache
        uses: actions/cache@v4
        with:
          path: |
            android-native/app/src/main/jniLibs/arm64-v8a/libstockfish.so
            android-native/chess-native/build/stockfish-19-corresponding-source.tar.gz
          key: neural-stockfish19-arm64-${{ hashFiles('android-native/chess-native/build.sh', 'android-native/chess-native/stockfish/**') }}
      - name: Preserve Stockfish and corresponding source
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        env:
          AKSARA_CHESS_ABIS: arm64-v8a
        run: bash android-native/chess-native/build.sh
      - name: Check offline knowledge and preservation contracts
        run: |
          python3 android-native/tools/sync_local_knowledge.py --check
          python3 android-native/ci/performance-contracts.py
      - name: Enable verified ARM64 emulation for Alpine package staging
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Stage Alpine ARM64 and build Android 16 seccomp-compatible PRoot
        run: bash android-native/scripts/build-aksara-linux.sh
      - name: Assert official Alpine archive contains guest shell and package manager
        run: |
          python3 - <<'PYCODE'
          import tarfile
          from pathlib import Path
          archive = Path("android-native/app/src/main/assets/linux/alpine-minirootfs.bundle")
          with tarfile.open(archive, mode="r:gz") as root:
              members = {member.name.lstrip("./"): member for member in root.getmembers()}
          for entry in ("bin/sh", "sbin/apk", "usr/bin/vim", "usr/bin/nano", "usr/bin/git", "usr/bin/python3", "usr/bin/htop", "usr/bin/fastfetch", "usr/local/bin/aksara-fetch", "etc/profile.d/90-aksara-intro.sh", "usr/share/aksara/fastfetch-wide.jsonc", "usr/share/aksara/fastfetch-compact.jsonc", "usr/share/aksara/aksara-logo.txt", "etc/aksara-preinstalled-packages.txt"):
              assert entry in members, f"Alpine archive missing {entry}"
              member = members[entry]
              assert member.isfile() or member.issym() or member.islnk(), f"Invalid Alpine entry: {entry}"
              print(f"Verified guest entry {entry}: type={member.type!r} link={member.linkname!r}")
          PYCODE
      # ChatApiTest is covered by the regular Android Native CI. Its network-cancellation
      # MockWebServer test is intermittently flaky; don't rebuild PRoot for that unrelated test.
      # CI executes Fastfetch 2.44 under ARM64 QEMU with BOTH original AKSARA
      # configs before this step, and validates shell syntax for startup hooks.
      # Rootfs contains preinstalled ARM64 packages and its apk database.
      # Focused Linux tests cover prompt, restart, categories and key mapping.
      - name: Compile rootless Linux preview with focused regression tests
        working-directory: android-native
        run: |
          set -euo pipefail
          tag="$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
          gradle --no-daemon --init-script ci/compiler-repository.init.gradle \
            -PenableLinuxPreview=true -PaksaraPreviewSuffix=.preview.p322.c"$tag" \
            assembleDebug :app:testDebugUnitTest \
            --tests 'my.aksara.nativeapp.core.linux.*' \
            --tests 'my.aksara.nativeapp.NativeIntegrationContractTest' \
            --tests 'my.aksara.nativeapp.SessionAndProviderStatusTest' \
            --tests 'my.aksara.nativeapp.TodayAdvancedNavigationTest' \
            --tests 'my.aksara.nativeapp.SettingsV2TechnicalRegistryTest' \
            --tests 'my.aksara.nativeapp.StudioContractsTest'
      - name: Verify native PTY, Alpine, signature and checksum
        run: |
          set -euo pipefail
          mkdir -p delivery
          tag="$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
          apk="AKSARA-Linux-V2-$tag.apk"
          cp android-native/app/build/outputs/apk/debug/app-debug.apk "delivery/$apk"
          unzip -tq "delivery/$apk"
          unzip -l "delivery/$apk" | grep -F 'lib/arm64-v8a/libaksara_proot.so'
          unzip -p "delivery/$apk" lib/arm64-v8a/libaksara_proot.so > "$RUNNER_TEMP/aksara-packaged-proot"
          python3 - "$RUNNER_TEMP/aksara-packaged-proot" <<'AKSARA_PACKAGED_TLS'
          import subprocess
          import sys
          rows = subprocess.check_output(["readelf", "-lW", sys.argv[1]], text=True).splitlines()
          tls = [r.split() for r in rows if r.strip().startswith("TLS ")]
          assert tls, "APK PRoot executable has no PT_TLS segment"
          assert int(tls[0][-1], 0) >= 64, "APK PRoot has underaligned ARM64 PT_TLS"
          print("APK native PRoot ARM64 TLS alignment verified")
          AKSARA_PACKAGED_TLS
          unzip -l "delivery/$apk" | grep -F 'lib/arm64-v8a/libaksara_proot_loader.so'
          unzip -l "delivery/$apk" | grep -F 'lib/arm64-v8a/libtermux.so'
          unzip -Z1 "delivery/$apk" | grep -Fx 'assets/linux/alpine-minirootfs.bundle'
          unzip -Z1 "delivery/$apk" | grep -Fx 'assets/linux/alpine-minirootfs.sha256'
          expected="$(awk '{print $1; exit}' android-native/app/src/main/assets/linux/alpine-minirootfs.sha256)"
          actual="$(unzip -p "delivery/$apk" assets/linux/alpine-minirootfs.bundle | sha256sum | awk '{print $1}')"
          test "$expected" = "$actual" || { echo 'ERROR: Alpine archive changed during APK packaging' >&2; exit 1; }
          unzip -l "delivery/$apk" | grep -F 'lib/arm64-v8a/libstockfish.so'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "delivery/$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "delivery/$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "delivery/$apk" > delivery/BADGING.txt
          grep -F "package: name='my.aksara.nativeapp.preview.p322.c$tag'" delivery/BADGING.txt
          grep -F "targetSdkVersion:'28'" delivery/BADGING.txt
          sha256sum "delivery/$apk" > delivery/SHA256SUMS.txt
          tar -czf "delivery/AKSARA-Linux-V2-$tag-proot-source.tar.gz" \
            -C "$RUNNER_TEMP/aksara-proot-static" --exclude=.git .
      - name: Upload Linux preview APK and corresponding GPL source
        uses: actions/upload-artifact@v4
        with:
          name: aksara-linux-v2-arm64
          path: delivery/
          retention-days: 60
          if-no-files-found: error
      - name: Publish experimental owner APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
          gh release create "aksara-linux-v2-$tag" delivery/*.apk delivery/*-proot-source.tar.gz delivery/SHA256SUMS.txt \
            --title "AKSARA Linux V2 $tag - Liquid Glass polish" \
            --notes "Experimental owner ARM64 APK: Alpine 3.22.8 + PRoot + PTY, preinstalled Fastfetch and developer tools. AKSARA dual-tone original ASCII logo, adaptive compact/wide system identity from real host/userland facts, one-time startup, persistent on/off and 4s timeout. No Android root. Isolated targetSdk 28 preview only. Liquid Glass header/footer and one-row commands UI require owner phone QA before merge. GPL PRoot source attached." \
            --prerelease --target "$GITHUB_SHA"
