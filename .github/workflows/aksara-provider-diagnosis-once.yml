name: AKSARA provider diagnosis one time
on:
  push:
    branches:
      - diagnostic/gemini-live-check
    paths:
      - .github/workflows/aksara-provider-diagnosis-once.yml
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node cloudflare/gemini-production-diagnostic-20261102.mjs
