name: AKSARA Gemini Flash Lite one-time real verification
on:
  push:
    branches:
      - feature/cloudflare-aksara-apps-migration-20261031
    paths:
      - .github/workflows/aksara-flash-lite-once.yml
jobs:
  real-fast-and-reasoning:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm the Cloudflare Worker has deployed the model
        run: sleep 20
      - name: Test real Gemini 3.5 Flash-Lite on both routes without logging model output
        run: node cloudflare/gemini-flash-lite-live-once.mjs
