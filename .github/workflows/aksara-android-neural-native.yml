name: AKSARA Neural PR321 owner APK
on:
  push:
    branches:
      - feature/aksara-neural-local-v1
    paths:
      - 'android-native/app/src/main/neural/aksara_neural.cpp'
      - 'android-native/app/src/main/java/my/aksara/nativeapp/core/neural/**'
      - 'android-native/app/src/test/java/my/aksara/nativeapp/core/neural/**'
      - 'android-native/app/src/main/neural/CMakeLists.txt'
      - '.github/workflows/aksara-android-neural-native.yml'
  workflow_dispatch:
    inputs:
      publish_manifest:
        description: 'Optional Git blob manifest for an already validated APK; skips all builds'
        type: string
        required: false
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: aksara-neural-cpu
  cancel-in-progress: true
jobs:
  build-native:
    if: github.ref == 'refs/heads/feature/aksara-neural-local-v1' && (github.event_name == 'push' || inputs.publish_manifest == '')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AKSARA_CI_COMPILER_REPOSITORY: /tmp/aksara-compiler-repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Retain original red-build compiler diagnosis (read-only, no rerun)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 43156590584 --repo "$GITHUB_REPOSITORY" --job 130977945220 --log > "$RUNNER_TEMP/historical-android.log"
          gh run view 43156590593 --repo "$GITHUB_REPOSITORY" --job 130978005436 --log > "$RUNNER_TEMP/historical-studio.log"
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP'])
          lines = []
          for name in ['historical-android.log', 'historical-studio.log']:
              lines.append(name + '\n')
              errors = [line for line in (directory / name).read_text().splitlines()
                        if re.search(r'e: file|error:|What went wrong|Compilation error|Unresolved reference', line)]
              lines.extend(line + '\n' for line in errors[:80])
          (directory / 'historical-compiler-errors.txt').write_text(''.join(lines))
          PYCODE
      - name: Prepare pinned llama.cpp source
        run: bash android-native/scripts/prepare-neural-native.sh
      - name: Bootstrap checksum-pinned Gradle
        run: |
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/232373824' -o "$RUNNER_TEMP/aksara-gradle.zip"
          printf '%s  %s\n' '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78' "$RUNNER_TEMP/aksara-gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/aksara-gradle.zip" -d "$RUNNER_TEMP/aksara-gradle"
          echo "$RUNNER_TEMP/aksara-gradle/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Prepare verified compiler repository
        run: |
          compiler_dir="$AKSARA_CI_COMPILER_REPOSITORY/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.1.21"
          mkdir -p "$compiler_dir"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/JetBrains/kotlin/releases/assets/598630357' -o "$compiler_dir/kotlin-compiler-embeddable-2.1.21.jar"
          curl --fail --location --retry 3 'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.1.21/kotlin-compiler-embeddable-2.1.21.pom' -o "$compiler_dir/kotlin-compiler-embeddable-2.1.21.pom"
          printf '%s  %s\n' '67a2e3673765f097725608cc7c843b0d8fdd94bd9af41327211361614aa57d49' "$compiler_dir/kotlin-compiler-embeddable-2.1.21.jar" 'dbbf8ac2550d5b1ae2a627f204f28b16f9271e36c44d8994aa3b139cbf70e45a' "$compiler_dir/kotlin-compiler-embeddable-2.1.21.pom" | sha256sum --check
      - name: Verify shared Web/Android Brain contracts
        run: node scripts/sync-android-voice-brain.cjs --check
      - name: Restore existing Stockfish build
        id: stockfish-cache
        uses: actions/cache@v4
        with:
          path: |
            android-native/app/src/main/jniLibs/arm64-v8a/libstockfish.so
            android-native/chess-native/build/stockfish-19-corresponding-source.tar.gz
          key: neural-stockfish19-arm64-${{ hashFiles('android-native/chess-native/build.sh', 'android-native/chess-native/stockfish/**') }}
      - name: Preserve Stockfish and corresponding source
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        env:
          AKSARA_CHESS_ABIS: arm64-v8a
        run: bash android-native/chess-native/build.sh
      - name: Check offline knowledge and preservation contracts
        run: |
          python3 android-native/tools/sync_local_knowledge.py --check
          python3 android-native/ci/performance-contracts.py
      - name: Compile JNI-enabled arm64 APK and run focused regression tests once
        working-directory: android-native
        run: |
          set -euo pipefail
          gradle --no-daemon --init-script ci/compiler-repository.init.gradle \
            -PenableNeuralNative=true -PaksaraPreviewSuffix=.preview.p321.c${GITHUB_SHA:0:8} \
            assembleDebug :app:testDebugUnitTest \
            --tests 'my.aksara.nativeapp.core.neural.*' \
            --tests 'my.aksara.nativeapp.NativeIntegrationContractTest' \
            --tests 'my.aksara.nativeapp.ChatApiTest' \
            --tests 'my.aksara.nativeapp.SessionAndProviderStatusTest' \
            --tests 'my.aksara.nativeapp.StudioContractsTest' \
            --tests 'my.aksara.nativeapp.TodayAdvancedNavigationTest' \
            --tests 'my.aksara.nativeapp.SettingsV2TechnicalRegistryTest' \
            --tests 'my.aksara.nativeapp.WebBrainBridgeTest' | tee "$RUNNER_TEMP/neural-build.log"
      - name: Check optimized native configuration
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          paths = list(Path('android-native/app/.cxx/Debug').glob('*/arm64-v8a/compile_commands.json'))
          assert paths, 'Missing native compile database'
          rows = json.loads(paths[0].read_text())
          for suffix in ['/aksara_neural.cpp', '/ggml-cpu.c', '/llama.cpp']:
              command = next(row['command'] for row in rows if row['file'].endswith(suffix))
              assert '-O3' in command, suffix + ' must be optimized'
          PYCODE
      - name: Prove arm64 neural JNI is inside APK
        run: |
          set -euo pipefail
          unzip -l android-native/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libaksara_neural.so'
      - name: Verify signature, native engines and checksum
        run: |
          set -euo pipefail
          mkdir -p delivery
          file="AKSARA-Neural-PR321-${GITHUB_SHA:0:8}.apk"
          cp android-native/app/build/outputs/apk/debug/app-debug.apk "delivery/$file"
          unzip -tq "delivery/$file"
          unzip -l "delivery/$file" | grep 'lib/arm64-v8a/libstockfish.so'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "delivery/$file"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "delivery/$file"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "delivery/$file" > delivery/BADGING.txt
          grep -F "package: name='my.aksara.nativeapp.preview.p321.c${GITHUB_SHA:0:8}'" delivery/BADGING.txt
          cp "$RUNNER_TEMP/neural-build.log" delivery/
          if [ -f "$RUNNER_TEMP/historical-compiler-errors.txt" ]; then cp "$RUNNER_TEMP/historical-compiler-errors.txt" delivery/; fi
          tar -czf delivery/test-results.tar.gz -C android-native/app/build/test-results/testDebugUnitTest .
          cp android-native/chess-native/build/stockfish-19-corresponding-source.tar.gz delivery/
          cp android-native/app/src/main/neural/third_party/llama.cpp/LICENSE delivery/llama.cpp-LICENSE
          (cd delivery && sha256sum "$file" stockfish-19-corresponding-source.tar.gz > SHA256SUMS)
          printf 'source_commit=%s\nabi=arm64-v8a\nllama_cpp=3837bf0bc02ea5d08f8ee3585fc8c7784a81bce8\nsigning=CI-debug\n' "$GITHUB_SHA" > delivery/BUILD.txt
          cat delivery/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified ARM64 APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: aksara-neural-pr321-arm64-${{ github.sha }}
          path: delivery/
          if-no-files-found: error
          compression-level: 0
      - name: Publish owner test APK from this unmerged revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="aksara-neural-pr321-${GITHUB_SHA:0:8}"
          gh release create "$tag" delivery/* --target "$GITHUB_SHA" --prerelease \
            --title "Aksara Neural PR #321 owner test ${GITHUB_SHA:0:8}" \
            --notes "Unmerged ARM64 debug APK from $GITHUB_SHA. This run compiles JNI, runs focused Neural and existing-function regression tests once, and verifies APK integrity, signature and alignment. Native host evidence is separate from Android physical-device testing, which remains pending. Optional models require explicit user download/import; no weights are bundled. Install on Android 12 or newer. Keep the Stockfish corresponding source companion with redistribution."
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: aksara-neural-build-failure
          path: |
            delivery/
            android-native/app/build/outputs/apk/debug/
            android-native/app/build/outputs/logs/
            android-native/app/build/reports/
            android-native/app/build/test-results/
            ${{ runner.temp }}/neural-build.log

  publish-verified:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/aksara-neural-local-v1' && inputs.publish_manifest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover verified APK using GitHub-only transport (no build)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PUBLICATION_COMMIT: ${{ github.sha }}
          MANIFEST_BLOB: ${{ inputs.publish_manifest }}
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, re, urllib.request, zipfile
          from pathlib import Path
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPO'] + '/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)
          def blob(sha):
              assert re.fullmatch('[0-9a-f]{40}', sha)
              response = get('git/blobs/' + sha)
              assert response['encoding'] == 'base64'
              return base64.b64decode(response['content'])
          manifest = json.loads(blob(os.environ['MANIFEST_BLOB']))
          validated = '0fbf8f779c814a3db1f72dd0ecc55408a037bd75'
          assert manifest['validated_commit'] == validated
          def android_tree(commit):
              tree = get('git/commits/' + commit)['tree']['sha']
              return next(row['sha'] for row in get('git/trees/' + tree)['tree'] if row['path'] == 'android-native')
          assert android_tree(validated) == android_tree(os.environ['PUBLICATION_COMMIT']), 'Android source changed since validation'
          delivery = Path('delivery'); delivery.mkdir()
          for file in manifest['files']:
              assert file['name'] in ['AKSARA-Neural-PR321-REPAIR-0fbf8f77.apk', 'evidence.zip']
              target = delivery / file['name']
              with target.open('wb') as output:
                  for sha in file['chunks']:
                      output.write(blob(sha))
              with target.open('rb') as source:
                  assert hashlib.file_digest(source, 'sha256').hexdigest() == file['sha256']
              assert target.stat().st_size == file['bytes']
          apk = delivery / 'AKSARA-Neural-PR321-REPAIR-0fbf8f77.apk'
          with apk.open('rb') as source:
              assert hashlib.file_digest(source, 'sha256').hexdigest() == '60625e4455819887c5d0edf482c8a441e5bab316b6f81fa6423f7358fbe8ae43'
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
              assert 'lib/arm64-v8a/libaksara_neural.so' in archive.namelist()
              assert 'lib/arm64-v8a/libstockfish.so' in archive.namelist()
          evidence = delivery / 'evidence.zip'
          with zipfile.ZipFile(evidence) as archive:
              for name in archive.namelist():
                  assert re.fullmatch('[A-Za-z0-9._-]+', name) and name != '..'
              archive.extractall(delivery)
          evidence.unlink()
          with (delivery / 'BUILD.txt').open('a') as receipt:
              receipt.write('publication_commit=' + os.environ['PUBLICATION_COMMIT'] + '\nandroid_tree=' + android_tree(validated) + '\n')
          PYCODE
      - name: Publish already validated APK and evidence (no Gradle)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download aksara-neural-pr321-fdf8bcad --repo "$REPO" \
            --pattern stockfish-19-corresponding-source.tar.gz --dir delivery
          echo 'ff5431773e59f3b963eca8dee9c55fa4eb226182808b75a379daceb1e0f58a4e  delivery/stockfish-19-corresponding-source.tar.gz' | sha256sum -c -
          (cd delivery && sha256sum *.apk *.tar.gz *.json *.txt *.md *.log llama.cpp-LICENSE > SHA256SUMS)
          gh release upload aksara-neural-pr321-repair-0fbf8f77 delivery/* --repo "$REPO" --clobber
          gh release edit aksara-neural-pr321-repair-0fbf8f77 --repo "$REPO" --draft=false --prerelease \
            --target "$GITHUB_SHA" --notes-file delivery/VALIDATION.md
          cat delivery/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo "Publication only. The verified local APK was transferred byte-for-byte; no build/test rerun." >> "$GITHUB_STEP_SUMMARY"
