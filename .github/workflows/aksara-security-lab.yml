name: AKSARA Security Lab
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/aksara-security-lab.yml"
      - "netlify/functions/**"
      - "bilik-antara*.js"
      - "security-lab.*"
      - "package*.json"
      - "scripts/aksara-security-summary.cjs"
      - "tests/aksara-security-*.test.cjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/aksara-security-lab.yml"
      - "netlify/functions/**"
      - "bilik-antara*.js"
      - "security-lab.*"
      - "package*.json"
      - "scripts/aksara-security-summary.cjs"
permissions:
  contents: read
concurrency:
  group: security-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owned-repo-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify scope, UI and report parser
        run: |
          node --check netlify/functions/aksara-security-audit.js
          node --check security-lab.js
          node --check security-ci.js
          node --check scripts/aksara-security-summary.cjs
          node --test tests/aksara-security-lab.test.cjs tests/aksara-security-summary.test.cjs
      - name: Scan owned repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: json
          output: trivy-report.json
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
      - name: Install Semgrep Community Edition
        run: |
          python3 -m venv /tmp/aksara-security-semgrep
          /tmp/aksara-security-semgrep/bin/pip install --disable-pip-version-check semgrep
      - name: Static analysis with Semgrep
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          /tmp/aksara-security-semgrep/bin/semgrep scan --config p/default --json --output semgrep-report.json \
            --exclude node_modules --exclude package-lock.json --exclude assets .
      - name: Generate sanitized CI result
        if: always()
        run: node scripts/aksara-security-summary.cjs
      - name: Upload full results and safe summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aksara-security-lab-${{ github.run_number }}
          path: |
            trivy-report.json
            semgrep-report.json
            security-ci-summary.json
          if-no-files-found: warn
          retention-days: 14
  publish-summary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: owned-repo-security
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout for restricted report publication
        uses: actions/checkout@v4
      - name: Download sanitized report only
        uses: actions/download-artifact@v4
        with:
          name: aksara-security-lab-${{ github.run_number }}
          path: ./security-summary-upload
      - name: Publish aggregate counts without findings details
        shell: bash
        run: |
          set -euo pipefail
          cp ./security-summary-upload/security-ci-summary.json "$RUNNER_TEMP/latest-security-summary.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin security-reports >/dev/null 2>&1; then
            git fetch origin security-reports
            git switch -C security-reports FETCH_HEAD
          else
            git switch --orphan security-reports
            git rm -r -f . >/dev/null 2>&1 || true
          fi
          cp "$RUNNER_TEMP/latest-security-summary.json" latest.json
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update sanitized security summary [skip ci]"
            git push origin HEAD:security-reports
          fi
