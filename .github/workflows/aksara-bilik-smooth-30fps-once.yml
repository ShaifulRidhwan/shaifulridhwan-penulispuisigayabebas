# One-shot render on the experiment branch; remove this workflow before merging.
name: AKSARA Bilik 30 FPS interpolation (one-time)
on:
  push:
    branches: [experiment/bilik-smooth-30fps-20261101]
    paths: [.github/workflows/aksara-bilik-smooth-30fps-once.yml]
permissions:
  contents: write
jobs:
  interpolate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Interpolate 16 to 30 FPS without touching other pages or audio
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          # Verify source remains the previously approved 16-FPS seamless loop.
          test "$(git hash-object bilik-antara-background.mp4)" = 9bace519fd3782e557882cf49ffa2ba9cd1ee456
          ffmpeg -hide_banner -loglevel error -y -i bilik-antara-background.mp4 \
            -vf 'minterpolate=fps=30:mi_mode=mci:mc_mode=obmc:me_mode=bidir:vsbmc=1,format=yuv420p' \
            -an -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart /tmp/aksara-smooth-30fps.mp4
          node -e 'const cp=require("node:child_process"),fs=require("node:fs");const file="/tmp/aksara-smooth-30fps.mp4";const data=JSON.parse(cp.execFileSync("ffprobe",["-v","error","-show_entries","stream=codec_name,width,height,r_frame_rate,nb_frames","-show_entries","format=duration,size","-of","json",file]));const s=data.streams[0],d=Number(data.format.duration),size=fs.statSync(file).size;if(s.codec_name!=="h264"||s.width!==480||s.height!==832||s.r_frame_rate!=="30/1"||Math.abs(d-9.13)>.08||size<200000||size>1500000)throw Error("30 FPS output validation failed: "+JSON.stringify(data));console.log("Validated smooth MP4:",s.r_frame_rate,d,size);'
          mv /tmp/aksara-smooth-30fps.mp4 bilik-antara-background.mp4
      - name: Commit only the generated MP4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bilik-antara-background.mp4
          git diff --cached --quiet && { echo "No change in MP4"; exit 1; }
          git commit -m "feat(video): interpolate cinematic Bilik loop to 30 FPS"
          git push origin HEAD:experiment/bilik-smooth-30fps-20261101
