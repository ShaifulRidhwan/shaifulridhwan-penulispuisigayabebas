name: AKSARA Mobile Backend QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'netlify.toml'
      - 'netlify/functions/lib/aksara-mobile-*'
      - 'netlify/functions/lib/studio-http.js'
      - 'netlify/functions/studio-android.mjs'
      - 'netlify/functions/studio-enhance-android.mjs'
      - 'netlify/functions/bilik-antara-live-android.mjs'
      - 'android-app/test/mobile-*.test.cjs'
      - '.github/workflows/aksara-mobile-backend-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check staged Netlify syntax
        run: |
          node --check netlify/functions/bilik-antara-live-android.mjs
          node --check netlify/functions/lib/aksara-mobile-live-broker.js
          node --check netlify/functions/lib/aksara-mobile-owner-auth.js
          node --check netlify/functions/lib/aksara-mobile-studio-adapter.js
          node --check netlify/functions/studio-android.mjs
          node --check netlify/functions/studio-enhance-android.mjs
      - name: Assert mobile security and web Origin isolation
        run: node --test android-app/test/mobile-*.test.cjs
