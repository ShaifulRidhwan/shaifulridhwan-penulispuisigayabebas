name: AKSARA PR305 Direct Merged APK
on:
  push:
    branches: ['rebuild/aksara-android-native-v1']
    paths: ['.github/workflows/aksara-pr305-apk-release.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: aksara-pr305-direct-apk-release
  cancel-in-progress: false
jobs:
  publish-pr305-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: '0585a4670cfe3197af2ec7a226f7b63a5a6174dd'
      MERGE_SHA: '724e3a38b20957986236591f6ed1c5cf4c46b336'
      VERIFIED_RUN_ID: '42861627212'
      RELEASE_TAG: 'aksara-android-pr305-merged-20261111'
      APK_NAME: 'AKSARA-Android-PR305-MERGED.apk'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify merged PR and exact successful CI run
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/305")"
          test "$(jq -r '.merged' <<< "$pr")" = true
          test "$(jq -r '.merge_commit_sha' <<< "$pr")" = "$MERGE_SHA"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFIED_RUN_ID}")"
          test "$(jq -r '.head_sha' <<< "$run")" = "$SOURCE_SHA"
          test "$(jq -r '.conclusion' <<< "$run")" = success
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFIED_RUN_ID}/jobs?per_page=100")"
          for job in build game-logic web-audit backend-smoke; do
            jq -e --arg job "$job" '[.jobs[] | select(.name == $job and .conclusion == "success")] | length == 1' <<< "$jobs" >/dev/null
          done
      - name: Download validated installable APK (no ZIP delivery)
        uses: actions/download-artifact@v5
        with:
          name: aksara-native-installable-apk
          run-id: 42861627212
          github-token: ${{ github.token }}
          path: delivery
      - name: Install Android tools for real APK verification
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0'
      - name: Validate APK identity, signing and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s delivery/app-debug.apk
          test "$(find delivery -type f -name '*.apk' | wc -l)" -eq 1
          mkdir -p release
          cp delivery/app-debug.apk "release/$APK_NAME"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "release/$APK_NAME" | tee /tmp/pr305-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "release/$APK_NAME" | tee /tmp/pr305-badging.txt
          grep -F "package: name='my.aksara.nativeapp' versionCode='4' versionName='0.2.0-chess-darkness'" /tmp/pr305-badging.txt
          test "$(stat -c%s "release/$APK_NAME")" -gt 1000000
          sha256sum "release/$APK_NAME" | tee /tmp/pr305-sha256.txt
          printf 'Source PR head: %s\nMerged commit: %s\nValidated CI run: %s\nAPK: %s\nSize: %s bytes\nSHA-256: %s\nAndroid APK signature: apksigner verified (debug signing).\nCI: build, unit tests, game-logic, web-audit, backend-smoke passed. Emulator skipped.\n' "$SOURCE_SHA" "$MERGE_SHA" "$VERIFIED_RUN_ID" "$APK_NAME" "$(stat -c%s "release/$APK_NAME")" "$(cut -d' ' -f1 /tmp/pr305-sha256.txt)" > /tmp/pr305-notes.txt
      - name: Publish standalone APK GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release tag already exists; never overwrite existing APK.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" "release/$APK_NAME" --repo "$GITHUB_REPOSITORY" --target "$MERGE_SHA" --title 'AKSARA Android PR #305 - Merged UI Fixes' --notes-file /tmp/pr305-notes.txt
      - name: Re-download published APK and compare byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p remote-check
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK_NAME" --dir remote-check
          test -s "remote-check/$APK_NAME"
          cmp "release/$APK_NAME" "remote-check/$APK_NAME"
          test "$(sha256sum "remote-check/$APK_NAME" | cut -d' ' -f1)" = "$(cut -d' ' -f1 /tmp/pr305-sha256.txt)"
          {
            echo "## PR #305 APK published and verified"
            echo
            echo "- Direct APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
            echo "- SHA-256: $(cut -d' ' -f1 /tmp/pr305-sha256.txt)"
            echo "- Source: ${SOURCE_SHA}"
            echo "- Merge: ${MERGE_SHA}"
            echo "- Re-downloaded release APK: byte-for-byte identical"
          } >> "$GITHUB_STEP_SUMMARY"
