name: Cloudflare AKSARA migration preview checks
on:
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-migration-ci.yml"
      - "netlify/functions/**"
      - "bilik-antara*"
      - "studio-antara*"
      - "antara-cahaya-dan-gelap*"
      - "perpustakaan-aksara*"
      - "assets/novel/**"
  workflow_dispatch:
jobs:
  cloudflare-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prepare only 3 apps
        run: node cloudflare/build.mjs
      - name: Validate assets, routing and preview containment
        run: node --test cloudflare/migration.test.mjs
      - name: Test transactional Cloudflare quota, Voice/Chat limits and health security
        run: node --test cloudflare/control.test.mjs
      - name: Verify all seven capability adapters stay private and fail closed
        run: node --test cloudflare/capabilities.test.mjs
      - name: Test safe public owned-page URL review fallback
        run: node --test cloudflare/owned-page-evidence.test.mjs
      - name: Verify Cloudflare Gemini-specific time budget and truthful status
        run: node --test tests/aksara-cloudflare-gemini-latency.test.cjs
      - name: Test public poem examples and interpretations
        run: node --test tests/aksara-public-poetry.test.cjs
      - name: Test native Workers AI identity, routing and streaming mocks
        run: node --test tests/aksara-workers-ai.test.cjs
      - name: Test Gemini four-key text pool and Voice isolation
        run: node --test tests/aksara-gemini-text-pool.test.cjs
      - name: Test Gemini connection details and Multi AI nested rows
        run: node --test tests/aksara-gemini-pool-ui.test.cjs
      - name: Validate Cloudflare Worker bundle without uploading or secrets
        run: npx --yes wrangler@4.135.0 deploy --config cloudflare/wrangler.jsonc --dry-run --outdir ./cloudflare/.verify-output
      - name: Smoke test actual local Cloudflare Workers runtime
        run: |
          npx --yes wrangler@4.135.0 dev --config cloudflare/wrangler.jsonc --local --port 8787 --var AKSARA_RATE_SALT:CI-local-ephemeral-salt-only-not-a-real-secret > /tmp/aksara-cloudflare-local.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl --max-time 2 -fsS http://127.0.0.1:8787/bilik-antara.html -o /tmp/aksara-bilik-preview.html; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/aksara-cloudflare-local.log; exit 1; fi
          grep -q 'data-cloudflare-preview="1"' /tmp/aksara-bilik-preview.html
          curl --max-time 5 -fsS http://127.0.0.1:8787/studio-antara.html -o /tmp/aksara-studio-preview.html
          curl --max-time 5 -fsS http://127.0.0.1:8787/antara-cahaya-dan-gelap.html -o /tmp/aksara-novel-preview.html
          curl --max-time 5 -fsS http://127.0.0.1:8787/assets/novel/pembaca.html -o /tmp/aksara-reader-preview.html
          # Static wallpaper replaces the MP4 loop. Verify actual response bytes and cache headers.
          curl --max-time 5 -fsS -D /tmp/aksara-wallpaper-headers \
            http://127.0.0.1:8787/aksara-celestial-static.webp \
            -o /tmp/aksara-wallpaper.webp
          grep -qi '^content-type: image/webp' /tmp/aksara-wallpaper-headers
          grep -Eqi '^cache-control: public, max-age=2592000' /tmp/aksara-wallpaper-headers
          curl --max-time 5 -fsS -D /tmp/aksara-wallpaper-versioned-headers \
            'http://127.0.0.1:8787/aksara-celestial-static.webp?v=1' -o /dev/null
          grep -Eqi '^cache-control: public, max-age=2592000' /tmp/aksara-wallpaper-versioned-headers
          node -e 'const fs=require("fs");const x=fs.readFileSync("/tmp/aksara-wallpaper.webp");if(x.length<3000||x.toString("ascii",0,4)!=="RIFF"||x.toString("ascii",8,12)!=="WEBP")process.exit(1)'
          # HTML must not inherit a month-long image cache.
          curl --max-time 5 -fsS -D /tmp/aksara-html-headers \
            http://127.0.0.1:8787/bilik-antara.html -o /dev/null
          if grep -Eqi '^cache-control: public, max-age=2592000' /tmp/aksara-html-headers; then exit 1; fi
          STATUS=$(curl --max-time 5 -s -o /tmp/aksara-denied.json -w '%{http_code}' -X POST \
            -H 'Origin: https://outside.example' -H 'Content-Type: application/json' \
            --data '{"prompt":"hi"}' \
            http://127.0.0.1:8787/.netlify/functions/studio-enhance)
          test "$STATUS" = 403
          # Valid HTTPS-origin Studio validation is covered by the Node adapter test.
          # Local dev serves HTTP; production Studio intentionally requires HTTPS.
          # SQLite Durable Object quota smoke: No Gemini key is supplied.
          for i in 1 2 3 4 5; do
            CODE=$(curl --max-time 5 -s -o /tmp/aksara-voice-$i.json -w '%{http_code}' -X POST \
              -H 'Origin: http://127.0.0.1:8787' -H 'Content-Type: application/json' \
              --data '{}' http://127.0.0.1:8787/.netlify/functions/bilik-antara-live-token)
            test "$CODE" = 503 || { cat /tmp/aksara-voice-$i.json; exit 1; }
          done
          CODE=$(curl --max-time 5 -s -o /tmp/aksara-voice-blocked.json -w '%{http_code}' -X POST \
            -H 'Origin: http://127.0.0.1:8787' -H 'Content-Type: application/json' \
            --data '{}' http://127.0.0.1:8787/.netlify/functions/bilik-antara-live-token)
          test "$CODE" = 429 || { cat /tmp/aksara-voice-blocked.json; exit 1; }
          echo 'Cloudflare local runtime + Durable Object quota smoke passed'
