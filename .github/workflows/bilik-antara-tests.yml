name: Bilik Antara Tests
on:
  pull_request:
    paths:
      - "netlify/functions/**"
      - "bilik-antara.html"
      - "karya-index.json"
      - "scripts/test-bilik-antara.cjs"
      - "scripts/test-tiktok-public-research.cjs"
  push:
    branches: [main]
    paths:
      - "netlify/functions/**"
      - "bilik-antara.html"
      - "karya-index.json"
      - "scripts/test-bilik-antara.cjs"
      - "scripts/test-tiktok-public-research.cjs"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and mocked tests
        run: |
          node --check netlify/functions/bilik-antara.js
          node --check netlify/functions/antara-intelligence.js
          node --check netlify/functions/tiktok-public-research.js
          node --test scripts/test-bilik-antara.cjs scripts/test-tiktok-public-research.cjs
