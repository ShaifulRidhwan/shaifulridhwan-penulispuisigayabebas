name: Bilik Antara Tests
on:
  pull_request:
    paths:
      - "netlify/functions/**"
      - "antara-cahaya-dan-gelap.html"
      - "assets/novel/**"
      - "scripts/test-novel-unification.cjs"
      - "bilik-antara.html"
      - "bilik-antara.css"
      - "bilik-antara-*.js"
      - "bilik-antara-video.css"
      - "bilik-antara-background.mp4"
      - "aksara-celestial-static.webp"
      - "tests/**"
      - "scripts/test-aksara-reliability.cjs"
      - "scripts/test-bilik-antara-identity.cjs"
      - ".github/workflows/bilik-antara-tests.yml"
      - "bilik-antara-pcm-worklet.js"
      - "netlify.toml"
      - "bilik-antara-cover-art.jpg"
      - "bilik-antara-woman-emblem.svg"
      - "karya-index.json"
      - "scripts/test-bilik-antara.cjs"
      - "scripts/test-tiktok-public-research.cjs"
      - "scripts/test-bilik-antara-design.cjs"
      - "scripts/test-bilik-antara-voice.cjs"
  push:
    branches: [main]
    paths:
      - "netlify/functions/**"
      - "antara-cahaya-dan-gelap.html"
      - "assets/novel/**"
      - "scripts/test-novel-unification.cjs"
      - "bilik-antara.html"
      - "bilik-antara.css"
      - "bilik-antara-*.js"
      - "bilik-antara-video.css"
      - "bilik-antara-background.mp4"
      - "aksara-celestial-static.webp"
      - "tests/**"
      - "scripts/test-aksara-reliability.cjs"
      - "scripts/test-bilik-antara-identity.cjs"
      - ".github/workflows/bilik-antara-tests.yml"
      - "bilik-antara-pcm-worklet.js"
      - "netlify.toml"
      - "bilik-antara-cover-art.jpg"
      - "bilik-antara-woman-emblem.svg"
      - "karya-index.json"
      - "scripts/test-bilik-antara.cjs"
      - "scripts/test-tiktok-public-research.cjs"
      - "scripts/test-bilik-antara-design.cjs"
      - "scripts/test-bilik-antara-voice.cjs"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and mocked tests
        run: |
          node --check netlify/functions/bilik-antara-stream.mjs
          node --check netlify/functions/aksara-provider-router.js
          node --check netlify/functions/lib/aksara-transport.js
          node --check netlify/functions/bilik-antara.js
          node --check netlify/functions/bilik-antara-live-token.js
          node --check bilik-antara-voice.js
          node --check bilik-antara-video.js
          node --check bilik-antara-avatar.js
          node --check bilik-antara-pcm-worklet.js
          node --check netlify/functions/antara-intelligence.js
          node --check netlify/functions/aksara-web-search.js
          node --check netlify/functions/aksara-tavily.js
          node --check netlify/functions/aksara-capabilities.js
          node --check netlify/functions/aksara-owned-page.js
          node --test tests/aksara-capabilities.test.cjs
          node --test tests/aksara-live-capability-qa.test.cjs
          node --test tests/aksara-privacy-defaults.test.cjs
          node --test tests/aksara-tavily.test.js
          node --check netlify/functions/aksara-data-analysis.js
          node --check netlify/functions/aksara-structured-output.js
          node --check bilik-antara-docx.js
          node --check netlify/functions/tiktok-public-research.js
          node --test tests/aksara-session-cutover.test.cjs
          node --check tests/aksara-p0-p2-integration.test.cjs
          node --test tests/aksara-p0-p2-integration.test.cjs
          node --test tests/aksara-identity-lock.test.cjs
          node --test tests/aksara-p0-p2.test.cjs cloudflare/owned-page-evidence.test.mjs
          node --test scripts/test-bilik-antara-video.cjs
          node --test scripts/test-bilik-antara.cjs scripts/test-tiktok-public-research.cjs scripts/test-bilik-antara-design.cjs scripts/test-bilik-antara-voice.cjs scripts/test-novel-unification.cjs scripts/test-bilik-antara-identity.cjs scripts/test-aksara-reliability.cjs tests/aksara-router.test.js
