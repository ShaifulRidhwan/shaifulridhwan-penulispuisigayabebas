name: AKSARA SD-Turbo arm64 experimental
on:
  workflow_dispatch:
  push:
    branches: ['rebuild/aksara-android-native-v1']
    paths: ['.github/workflows/aksara-sdturbo-native-experimental.yml']
permissions:
  contents: read
concurrency:
  group: aksara-sdturbo-experimental-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AKSARA_CI_COMPILER_REPOSITORY: /tmp/aksara-compiler-repository
      SDCPP_COMMIT: b7a74e68d7409924f57fb52d3d721772d1084853
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android native toolchain
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Fetch exact reviewed SD runtime and GGML
        run: |
          set -euo pipefail
          sd=android-native/app/src/main/cpp/third_party/stable-diffusion.cpp
          mkdir -p "$(dirname "$sd")"
          git clone --depth 1 --branch master-955-b7a74e6 --single-branch https://github.com/leejet/stable-diffusion.cpp "$sd"
          test "$(git -C "$sd" rev-parse HEAD)" = "$SDCPP_COMMIT"
          git -C "$sd" submodule update --init --depth 1 ggml
          test -f "$sd/ggml/CMakeLists.txt"
      - name: Bootstrap verified Gradle
        run: |
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/232373824' -o "$RUNNER_TEMP/gradle.zip"
          printf '%s  %s\n' '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78' "$RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Bootstrap verified Kotlin compiler
        run: |
          dir="$AKSARA_CI_COMPILER_REPOSITORY/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.1.21"
          mkdir -p "$dir"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/JetBrains/kotlin/releases/assets/598630357' -o "$dir/kotlin-compiler-embeddable-2.1.21.jar"
          curl --fail --location --retry 3 'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.1.21/kotlin-compiler-embeddable-2.1.21.pom' -o "$dir/kotlin-compiler-embeddable-2.1.21.pom"
          printf '%s  %s\n' '67a2e3673765f097725608cc7c843b0d8fdd94bd9af41327211361614aa57d49' "$dir/kotlin-compiler-embeddable-2.1.21.jar" 'dbbf8ac2550d5b1ae2a627f204f28b16f9271e36c44d8994aa3b139cbf70e45a' "$dir/kotlin-compiler-embeddable-2.1.21.pom" | sha256sum --check
      - name: Compile native arm64 JNI and APK
        working-directory: android-native
        run: gradle --no-daemon --max-workers=2 --init-script ci/compiler-repository.init.gradle -PenableSdTurboNative=true :app:assembleDebug
      - name: Inspect actual packaged JNI
        run: |
          set -euo pipefail
          apk=android-native/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libaksara_sdturbo.so'
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aksara-sdturbo-arm64-experimental
          if-no-files-found: warn
          path: |
            android-native/app/build/outputs/apk/debug/
            android-native/app/.cxx/**/CMakeCache.txt
