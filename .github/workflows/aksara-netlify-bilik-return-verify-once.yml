name: Verify Netlify Bilik return after PR171
on:
  push:
    branches: [diagnostic/netlify-bilik-return-verify-20261102]
    paths: ['.github/workflows/aksara-netlify-bilik-return-verify-once.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify production Netlify canonical page and provider labels
        run: |
          node --input-type=module <<'NODE'
          const base="https://shaifulridhwan-penulispuisigayabebas.netlify.app";
          for(const [name,path] of [["BILIK_CANONICAL","/bilik-antara.html"],["HOMEPAGE","/"]]){
            const res=await fetch(base+path,{redirect:"manual",signal:AbortSignal.timeout(20000)});
            const html=await res.text();
            const result={status:res.status,location:res.headers.get("location"),length:html.length};
            if(name==="BILIK_CANONICAL"){
              result.hasProviderIcons=html.includes("providerMarks");
              result.savesProvider=html.includes("provider:data.provider||null");
              result.stylesheetV9=html.includes("bilik-antara-suite.css?v=9");
              result.hasChatEndpoint=html.includes('const ENDPOINT="/.netlify/functions/bilik-antara"');
              console.log(name,JSON.stringify(result));
              if(res.status!==200||!result.hasProviderIcons||!result.savesProvider||!result.stylesheetV9||!result.hasChatEndpoint)process.exitCode=1;
            }else{
              result.netlifyBilikLinkCount=(html.match(/href="bilik-antara.html"/g)||[]).length;
              console.log(name,JSON.stringify(result));
              if(res.status!==200||result.netlifyBilikLinkCount!==2)process.exitCode=1;
            }
          }
          NODE