name: AKSARA Gemini 3.8 after timeout repair
on:
  push:
    branches:
      - feature/cloudflare-aksara-apps-migration-20261031
    paths:
      - .github/workflows/aksara-gemini-38-timeout-retest-once.yml
jobs:
  verify-both-models:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test actual Gemini 3.6 and 3.8 answers without logging prompts or secrets
        run: node cloudflare/gemini-36-38-live-once.mjs
