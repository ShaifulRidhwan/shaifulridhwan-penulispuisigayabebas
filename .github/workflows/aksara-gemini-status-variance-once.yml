name: AKSARA Gemini status variance diagnostic once
on:
  push:
    branches: [diagnostic/gemini-status-variance-20261102]
    paths: ['.github/workflows/aksara-gemini-status-variance-once.yml']
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify deployed PR167 and real advanced Gemini
        run: |
          node --input-type=module <<'NODE'
          const base="https://aksara-apps.mshaifulridhwan.workers.dev";
          async function safeJson(response){return await response.json().catch(()=>({}))}
          const page=await fetch(base+"/bilik-antara.html",{signal:AbortSignal.timeout(15000)});
          const html=await page.text();
          console.log("DEPLOYED_UI",JSON.stringify({http:page.status,categoryBadge:html.includes("HTTP 400 · Region")}));
          async function post(label,payload){
            const r=await fetch(base+"/.netlify/functions/bilik-antara",{
              method:"POST",headers:{"Origin":base,"Content-Type":"application/json"},
              body:JSON.stringify(payload),signal:AbortSignal.timeout(40000)});
            const d=await safeJson(r);
            const g=d.providers?.find(x=>x.id==="gemini")||null;
            console.log(label,JSON.stringify({http:r.status,gemini:g&&{model:g.model,status:g.status,http:g.http||null,
              upstreamCode:g.upstreamCode||null,upstreamReason:g.upstreamReason||null,category:g.category||null},
              provider:d.provider||null,model:d.model||null,hasReply:!!d.reply,
              geminiDiagnosis:d.routing?.geminiDiagnosis||null,
              failedAttempts:(d.routing?.failedAttempts||d.providerFailures||[]).map(x=>({
                provider:x.provider,status:x.status,reason:x.reason,upstreamCode:x.upstreamCode,category:x.category})),
              code:d.code||null}));
            return {r,d};
          }
          await post("HEALTH",{providerStatus:true});
          const technical=await post("TECHNICAL_CHAT",{
            question:"Semak algoritma JavaScript ini, nyatakan kerumitan masa dan satu pembaikan: function sum(a){return a.reduce((x,y)=>x+y,0)}",
            history:[],thoughtMode:"cahaya"});
          if(page.status!==200||!html.includes("HTTP 400 · Region")||technical.r.status!==200||!technical.d.reply)process.exitCode=1;
          NODE