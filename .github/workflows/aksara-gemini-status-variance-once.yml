name: AKSARA Gemini status variance diagnostic once
on:
  push:
    branches: [diagnostic/gemini-status-variance-20261102]
    paths: ['.github/workflows/aksara-gemini-status-variance-once.yml']
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify deployed PR166 UI and genuine non-poetry Gemini response
        run: |
          node --input-type=module <<'NODE'
          const base="https://aksara-apps.mshaifulridhwan.workers.dev";
          const timeout=ms=>AbortSignal.timeout(ms);
          try{
            const page=await fetch(base+"/bilik-antara.html",{signal:timeout(15000)});
            const html=await page.text();
            console.log("DEPLOYED_UI",JSON.stringify({http:page.status,bytes:html.length,
              pr166Marker:html.includes("Ready · Probe 429"),
              diagnosticHttpMarker:html.includes("Offline · HTTP ")}));
          }catch(e){console.log("DEPLOYED_UI_ERROR",JSON.stringify({name:e.name,message:String(e.message).slice(0,100)}));}
          async function post(label,payload){
            try{
              const r=await fetch(base+"/.netlify/functions/bilik-antara",{
                method:"POST",headers:{"Origin":base,"Content-Type":"application/json"},
                body:JSON.stringify(payload),signal:timeout(40000)});
              const d=await r.json().catch(()=>({}));
              const p=d.providers?.find(x=>x.id==="gemini");
              console.log(label,JSON.stringify({http:r.status,gemini:p||null,preferred:d.preferredProvider||null,
                provider:d.provider||null,model:d.model||null,hasReply:!!d.reply,
                geminiDiagnosis:d.routing?.geminiDiagnosis||null,
                failedAttempts:(d.routing?.failedAttempts||d.providerFailures||[]).map(f=>({
                  provider:f.provider,status:f.status,reason:f.reason,quotaKind:f.quotaKind})),
                code:d.code||null}));
            }catch(e){console.log(label+"_ERROR",JSON.stringify({name:e.name,message:String(e.message).slice(0,100)}));}
          }
          await post("STATUS_BEFORE",{providerStatus:true});
          await post("ORDINARY_CHAT",{question:"Jelaskan maksud kompleksiti algoritma O(n log n) dalam dua ayat ringkas.",history:[]});
          await post("STATUS_AFTER",{providerStatus:true});
          NODE