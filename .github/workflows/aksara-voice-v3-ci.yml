name: AKSARA Voice 3.0 Regression
on:
  pull_request:
    paths:
      - 'bilik-antara-voice*'
      - 'bilik-antara-dialek.js'
      - 'bilik-antara.html'
      - 'bilik-antara-observability.js'
      - 'tests/aksara-voice-v3.test.cjs'
      - '.github/workflows/aksara-voice-v3-ci.yml'
  push:
    branches:
      - 'feature/aksara-voice-v3-dialek-ui'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check bilik-antara-dialek.js
          node --check bilik-antara-voice.js
          node --check bilik-antara-voice-core-v3.js
          node --check bilik-antara-observability.js
      - name: Run Voice v3 regression
        run: node --test tests/aksara-voice-v3.test.cjs
