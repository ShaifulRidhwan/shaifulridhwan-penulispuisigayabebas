name: Perpustakaan AKSARA checks
on:
  pull_request:
    paths:
      - "perpustakaan-aksara.html"
      - "perpustakaan-aksara.css"
      - "bilik-antara.html"
      - "scripts/test-perpustakaan-aksara.cjs"
      - "scripts/test-perpustakaan-browser.cjs"
      - ".github/workflows/perpustakaan-aksara.yml"
  push:
    branches: [main]
    paths:
      - "perpustakaan-aksara.html"
      - "perpustakaan-aksara.css"
      - "bilik-antara.html"
      - "scripts/test-perpustakaan-aksara.cjs"
      - "scripts/test-perpustakaan-browser.cjs"
      - ".github/workflows/perpustakaan-aksara.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check catalog JS, sources and feature links
        run: node --test scripts/test-perpustakaan-aksara.cjs
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Audit catalog mobile/desktop and direct novel reader
        run: |
          python3 -m http.server 4177 --bind 127.0.0.1 > /tmp/perpustakaan-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -sf http://127.0.0.1:4177/perpustakaan-aksara.html > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-perpustakaan-browser.cjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perpustakaan-aksara-mobile-desktop
          path: browser-audit-artifacts/perpustakaan/
          if-no-files-found: ignore
