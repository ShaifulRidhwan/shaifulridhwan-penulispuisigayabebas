name: AKSARA Android Native
on:
  pull_request:
    paths: ['android-native/**', 'docs/android-rebuild/**', '.github/workflows/aksara-android-native.yml']
  push:
    branches: ['rebuild/aksara-android-native-v1']
concurrency:
  group: aksara-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node android-native/visual-tests/capture-web.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-design-reference
          path: docs/android-rebuild/visual-comparison/web/
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap checksum-pinned Gradle using curl
        run: |
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/232373824' -o "$RUNNER_TEMP/aksara-gradle.zip"
          printf '%s  %s\n' '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78' "$RUNNER_TEMP/aksara-gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/aksara-gradle.zip" -d "$RUNNER_TEMP/aksara-gradle"
          echo "$RUNNER_TEMP/aksara-gradle/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Seed verified Kotlin compiler cache (official release asset)
        run: |
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 -H 'Accept: application/octet-stream' 'https://api.github.com/repos/JetBrains/kotlin/releases/assets/598630357' -o "$RUNNER_TEMP/kotlin-compiler-embeddable-2.1.21.jar"
          printf '%s  %s\n' '67a2e3673765f097725608cc7c843b0d8fdd94bd9af41327211361614aa57d49' "$RUNNER_TEMP/kotlin-compiler-embeddable-2.1.21.jar" | sha256sum --check
          compiler_hash=$(sha1sum "$RUNNER_TEMP/kotlin-compiler-embeddable-2.1.21.jar" | cut -d' ' -f1)
          compiler_cache="$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-compiler-embeddable/2.1.21/$compiler_hash"
          mkdir -p "$compiler_cache"
          cp "$RUNNER_TEMP/kotlin-compiler-embeddable-2.1.21.jar" "$compiler_cache/"
      - run: gradle --no-daemon testDebugUnitTest :engine:runtime:testDebugUnitTest assembleDebug assembleDebugAndroidTest
        working-directory: android-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aksara-native-debug
          path: |
            android-native/app/build/outputs/apk/
            android-native/app/build/reports/tests/
            android-native/app/build/outputs/androidTest-results/
  emulator:
    needs: [build, web-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: web-design-reference
          path: docs/android-rebuild/visual-comparison/web
      - uses: actions/download-artifact@v4
        with:
          name: aksara-native-debug
          path: android-native/build-artifact
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: bash android-native/visual-tests/run-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-visual-and-performance-evidence
          path: |
            docs/android-rebuild/visual-comparison/
            android-native/app/build/reports/
