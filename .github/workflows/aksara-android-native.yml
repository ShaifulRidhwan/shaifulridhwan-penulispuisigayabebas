name: AKSARA Android Native
on:
  pull_request:
    paths: ['android-native/**', 'docs/android-rebuild/**', '.github/workflows/aksara-android-native.yml']
  push:
    branches: ['rebuild/aksara-android-native-v1']
  workflow_dispatch:
concurrency:
  group: aksara-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  game-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test android-native/game-tests/*.test.cjs
  web-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1-${{ runner.os }}
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Eclipse game controls, full fights and browser screenshots
        run: |
          python3 -m http.server 8765 --directory android-native/app/src/main/assets/game > "$RUNNER_TEMP/eclipse-server.log" 2>&1 &
          game_server_pid=$!
          trap 'kill "$game_server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765 > /dev/null; then break; fi
            sleep 0.2
          done
          node android-native/game-tests/browser.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eclipse-browser-gameplay
          path: docs/android-rebuild/game/browser-evidence/
      - run: node android-native/visual-tests/capture-web.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: web-design-reference
          path: docs/android-rebuild/visual-comparison/web/
  backend-smoke:
    # PR and push share a cancel-in-progress group; test in the surviving run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Real production DNS, Chat stream, provider health and Live token
        run: node android-native/ci/live-backend-smoke.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: production-backend-contract-evidence
          path: docs/android-rebuild/backend-contract/live-check.json
  build:
    runs-on: ubuntu-latest
    outputs:
      apk_ready: ${{ steps.compile.outputs.apk_ready }}
      apk_sha256: ${{ steps.apk.outputs.apk_sha256 }}
    env:
      AKSARA_CI_COMPILER_REPOSITORY: /tmp/aksara-compiler-repository
      AKSARA_PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      AKSARA_PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref == 'rebuild/aksara-android-native-v1' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v5
      - name: Bootstrap checksum-pinned Gradle using curl
        run: |
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 -H 'Accept: application/octet-stream' -H "Authorization: Bearer ${{ github.token }}" 'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/232373824' -o "$RUNNER_TEMP/aksara-gradle.zip"
          printf '%s  %s\n' '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78' "$RUNNER_TEMP/aksara-gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/aksara-gradle.zip" -d "$RUNNER_TEMP/aksara-gradle"
          echo "$RUNNER_TEMP/aksara-gradle/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Prepare verified local compiler repository (official files)
        run: |
          compiler_dir="$AKSARA_CI_COMPILER_REPOSITORY/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.1.21"
          mkdir -p "$compiler_dir"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 -H 'Accept: application/octet-stream' -H "Authorization: Bearer ${{ github.token }}" 'https://api.github.com/repos/JetBrains/kotlin/releases/assets/598630357' -o "$compiler_dir/kotlin-compiler-embeddable-2.1.21.jar"
          curl --fail --location --retry 3 'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.1.21/kotlin-compiler-embeddable-2.1.21.pom' -o "$compiler_dir/kotlin-compiler-embeddable-2.1.21.pom"
          printf '%s  %s\n' '67a2e3673765f097725608cc7c843b0d8fdd94bd9af41327211361614aa57d49' "$compiler_dir/kotlin-compiler-embeddable-2.1.21.jar" 'dbbf8ac2550d5b1ae2a627f204f28b16f9271e36c44d8994aa3b139cbf70e45a' "$compiler_dir/kotlin-compiler-embeddable-2.1.21.pom" | sha256sum --check
      - name: Verify Android performance feature preservation
        run: python3 android-native/ci/performance-contracts.py
      - name: Verify Android Voice Brain equals web source of truth
        run: node scripts/sync-android-voice-brain.cjs --check
      - name: Restore verified Stockfish 19 build cache
        id: stockfish-cache
        uses: actions/cache@v5
        with:
          path: |
            android-native/app/src/main/jniLibs/arm64-v8a/libstockfish.so
            android-native/app/src/main/jniLibs/x86_64/libstockfish.so
            android-native/chess-native/build/stockfish-19-corresponding-source.tar.gz
          key: stockfish19-ndk27-linux-v1-${{ hashFiles('android-native/chess-native/build.sh', 'android-native/chess-native/stockfish/**', 'android-native/chess-native/README.md') }}
      - name: Build Stockfish Android and GPL source companion on cache miss
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager 'ndk;27.2.12479018'
          bash android-native/chess-native/build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: aksara-native-stockfish-source
          path: android-native/chess-native/build/stockfish-19-corresponding-source.tar.gz
          if-no-files-found: error
      - name: Compile installable APKs
        id: compile
        working-directory: android-native
        run: |
          # Every unmerged TODAY revision is a separately installable test app.
          # CI debug signing keys are generated on runners and are not stable across
          # runs; never reuse the installed production package ID for these previews.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$GITHUB_HEAD_REF" == feature/aksara-today-* ]]; then
            test -n "$AKSARA_PREVIEW_PR_NUMBER"
            test -n "$AKSARA_PREVIEW_HEAD_SHA"
            short="${AKSARA_PREVIEW_HEAD_SHA:0:8}"
            preview_suffix=".preview.p${AKSARA_PREVIEW_PR_NUMBER}.c${short}"
            gradle --no-daemon --init-script ci/compiler-repository.init.gradle assembleDebug "-PaksaraPreviewSuffix=$preview_suffix"
          else
            gradle --no-daemon --init-script ci/compiler-repository.init.gradle assembleDebug
          fi
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            gradle --no-daemon --init-script ci/compiler-repository.init.gradle assembleDebugAndroidTest
          fi
          echo "apk_ready=true" >> "$GITHUB_OUTPUT"
      - name: Verify APK archive, alignment, signature, ABI and package identity
        id: apk
        working-directory: android-native
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -tq "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > app/build/outputs/apk/debug/BADGING.txt
          grep -F "native-code:" app/build/outputs/apk/debug/BADGING.txt
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$GITHUB_HEAD_REF" == feature/aksara-today-* ]]; then
            short="${AKSARA_PREVIEW_HEAD_SHA:0:8}"
            expected="my.aksara.nativeapp.preview.p${AKSARA_PREVIEW_PR_NUMBER}.c${short}"
            grep -F "package: name='$expected'" app/build/outputs/apk/debug/BADGING.txt
          else
            grep -F "package: name='my.aksara.nativeapp'" app/build/outputs/apk/debug/BADGING.txt
          fi
          stat -c 'apk_bytes=%s' "$apk"
          sha256sum "$apk" | tee app/build/outputs/apk/debug/SHA256SUMS
          echo "apk_sha256=$(sha256sum "$apk" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'source_commit=%s\nbuild_run=%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' '${{ github.run_id }}' | tee app/build/outputs/apk/debug/BUILD.txt
      - uses: actions/upload-artifact@v5
        with:
          name: aksara-native-installable-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
      - name: Unit tests
        id: unit
        continue-on-error: true
        working-directory: android-native
        run: gradle --no-daemon --init-script ci/compiler-repository.init.gradle testDebugUnitTest :engine:chess:test :engine:runtime:testDebugUnitTest :engine:voice:testDebugUnitTest
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: aksara-native-debug
          path: |
            android-native/app/build/outputs/apk/
            android-native/app/build/reports/tests/
            android-native/app/build/outputs/androidTest-results/
      - name: Preserve failed unit-test result
        if: steps.unit.outcome == 'failure'
        run: exit 1
  emulator:
    # Manual-only visual/runtime diagnostic; never block PR merge on headless emulator.
    needs: [build, web-audit]
    if: github.event_name == 'workflow_dispatch' && needs.build.outputs.apk_ready == 'true' && needs.web-audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v5
        with:
          name: web-design-reference
          path: docs/android-rebuild/visual-comparison/web
      - uses: actions/download-artifact@v5
        with:
          name: aksara-native-debug
          path: android-native/build-artifact
      - uses: actions/download-artifact@v5
        if: github.event_name == 'pull_request'
        with:
          name: aksara-native-debug
          run-id: 42798190575
          github-token: ${{ github.token }}
          path: android-native/baseline-artifact
      - uses: actions/download-artifact@v5
        if: github.event_name == 'pull_request'
        with:
          name: native-visual-and-performance-evidence
          run-id: 42798190575
          github-token: ${{ github.token }}
          path: android-native/baseline-evidence
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: bash android-native/ci/run-validation.sh '${{ github.event_name }}'
      - name: Web/Native visual parity audit (strict 98% report, not emulator instrumentation)
        if: always()
        run: |
          python -m pip install --quiet pillow numpy scikit-image
          parity_status=0
          python android-native/visual-tests/compare.py > "$RUNNER_TEMP/aksara-visual-audit.log" 2>&1 || parity_status=$?
          tail -n 45 "$RUNNER_TEMP/aksara-visual-audit.log"
          # A missing or corrupt audit is a CI failure. A measured design mismatch
          # is reported honestly but is not an emulator/feature regression.
          python - <<'PY'
          import collections, json, os, pathlib
          path = pathlib.Path("docs/android-rebuild/visual-comparison/results.json")
          rows = json.loads(path.read_text())
          if not rows:
              raise SystemExit("Visual audit produced no evidence")
          totals = collections.Counter(row["status"] for row in rows)
          label = ", ".join(f"{status}: {number}" for status, number in sorted(totals.items()))
          print("Web/native visual audit (98% strict target):", label)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Web/native parity (98% target; independent of emulator test status)\\n\\n")
              f.write(label + "\\n\\n")
              f.write("See the `native-visual-and-performance-evidence` artifact for unmodified screenshots, region scores, and mismatches.\\n")
          PY
          if [ "$parity_status" -ne 0 ]; then
            echo "::warning title=Web/native visual parity remains below 98%::Screenshots and strict mismatch report were preserved. Native emulator instrumentation is evaluated separately; visual calibration remains unresolved."
          fi
      - name: Preserve approved native visuals at four sizes
        if: always() && github.event_name == 'pull_request'
        run: python android-native/visual-tests/compare-native-preservation.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-visual-and-performance-evidence
          path: |
            docs/android-rebuild/visual-comparison/
            android-native/app/build/reports/

  today-preview-apk:
    # A direct, SHA-locked .apk preview for TODAY UI PRs, without artifact ZIPs.
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'feature/aksara-today-') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.build.result == 'success' &&
      needs.backend-smoke.result == 'success' &&
      needs.game-logic.result == 'success' &&
      needs.web-audit.result == 'success'
    needs: [build, backend-smoke, game-logic, web-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: actions/download-artifact@v5
        with:
          name: aksara-native-installable-apk
          path: preview-today
      - name: Publish verified single APK (not ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s preview-today/app-debug.apk
          echo "${{ needs.build.outputs.apk_sha256 }}  preview-today/app-debug.apk" | sha256sum -c -
          unzip -tq preview-today/app-debug.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose preview-today/app-debug.apk
          short="${HEAD_SHA:0:8}"
          tag="aksara-today-preview-pr${PR_NUMBER}-${short}"
          file="AKSARA-TODAY-PR${PR_NUMBER}-${short}.apk"
          cp preview-today/app-debug.apk "preview-today/$file"
          (cd preview-today && sha256sum "$file" > SHA256SUMS)
          if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "preview-today/$file" preview-today/SHA256SUMS -R "$REPO" --clobber
          else
            gh release create "$tag" "preview-today/$file" preview-today/SHA256SUMS \
              -R "$REPO" --target "$HEAD_SHA" --prerelease \
              --title "AKSARA TODAY PR #$PR_NUMBER test APK $short" \
              --notes "Unmerged UI preview from commit $HEAD_SHA. CI checks passed; device QA is still required."
          fi
          gh release view "$tag" -R "$REPO" --json assets \
            --jq '.assets[].name' | grep -Fx "$file"
          # A success badge is worthless if the actual published file differs.
          mkdir -p verified-release
          gh release download "$tag" -R "$REPO" --pattern "$file" --dir verified-release
          cmp "preview-today/$file" "verified-release/$file"
          echo "${{ needs.build.outputs.apk_sha256 }}  verified-release/$file" | sha256sum -c -
          echo "### PR #$PR_NUMBER single APK (release bytes verified)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$REPO/releases/download/$tag/$file" >> "$GITHUB_STEP_SUMMARY"
          cat preview-today/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

  merged-single-apk:
    # Publish ONE installable .apk asset, not the ZIP wrapper from Actions artifacts.
    # Only the merged Android development branch and a fully green CI may publish.
    needs: [build, backend-smoke, game-logic, web-audit]
    if: >-
      ((github.event_name == 'push' &&
       github.ref == 'refs/heads/rebuild/aksara-android-native-v1') ||
       (github.event_name == 'pull_request' &&
       github.head_ref == 'rebuild/aksara-android-native-v1' &&
       github.event.pull_request.head.repo.full_name == github.repository)) &&
      needs.build.result == 'success' &&
      needs.backend-smoke.result == 'success' &&
      needs.game-logic.result == 'success' &&
      needs.web-audit.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: aksara-native-installable-apk
          path: merged-apk
      - name: Publish direct APK and checksum for PR308 + PR309 + PR310 merged build
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s merged-apk/app-debug.apk
          short="${MERGED_SHA:0:12}"
          tag="aksara-android-308-309-310-merged-$short"
          file="AKSARA-Android-PR308-309-310-MERGED-$short.apk"
          cp merged-apk/app-debug.apk "merged-apk/$file"
          (cd merged-apk && sha256sum "$file" > SHA256SUMS)
          if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "merged-apk/$file" merged-apk/SHA256SUMS -R "$REPO" --clobber
          else
            gh release create "$tag" "merged-apk/$file" merged-apk/SHA256SUMS \
              -R "$REPO" --target "$MERGED_SHA" --prerelease \
              --title "AKSARA Android • PR #308 + #309 + #310 merged ($short)" \
              --notes "One installable APK from the merged Android development branch at commit $MERGED_SHA. Android compilation, unit tests, backend smoke, game tests and web audit have passed. Physical device verification remains user-side."
          fi
          gh release view "$tag" -R "$REPO" --json assets \
            --jq '.assets[].name' | grep -Fx "$file"
          echo "### Direct installable APK from merged Android branch" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$REPO/releases/download/$tag/$file" >> "$GITHUB_STEP_SUMMARY"
          cat merged-apk/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
