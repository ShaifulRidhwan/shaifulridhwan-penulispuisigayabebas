name: AKSARA Android Debug APK

on:
  push:
    branches: [aksara-android]
    paths:
      - 'android-app/**'
      - '.github/workflows/aksara-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aksara-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already provides Android SDK cmdline-tools.
      # Avoid setup-android@v3: its legacy 'tools' package request fails in newer SDK repos.
      - name: Prepare Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "Android sdkmanager not found"; exit 1; }
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AKSARA-Android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
