name: Bilik Antara Browser Audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bilik-antara.html"
      - "bilik-antara.css"
      - "bilik-antara-suite.css"
      - "bilik-antara-*.js"
      - "bilik-antara-ui-polish.css"
      - "scripts/test-aksara-ui-polish-browser.cjs"
      - "bilik-antara-bg-*.webp"
      - "aksara-celestial-static.webp"
      - "scripts/test-bilik-antara-browser.cjs"
      - "scripts/test-aksara-voice-v4-browser.cjs"
      - "scripts/test-aksara-voice-2d-browser.cjs"
      - "scripts/test-aksara-live2d-v03-browser.cjs"
      - "bilik-antara-live2d-v03.js"
      - "bilik-antara-live2d-bridge-v03.js"
      - "scripts/test-aksara-voice-v4-live-controls-browser.cjs"
      - "scripts/test-bilik-antara-background.cjs"
      - ".github/workflows/bilik-antara-browser-audit.yml"
  push:
    branches: [main]
    paths:
      - "bilik-antara.html"
      - "bilik-antara.css"
      - "bilik-antara-suite.css"
      - "bilik-antara-*.js"
      - "bilik-antara-ui-polish.css"
      - "scripts/test-aksara-ui-polish-browser.cjs"
      - "bilik-antara-bg-*.webp"
      - "aksara-celestial-static.webp"
      - "scripts/test-bilik-antara-browser.cjs"
      - "scripts/test-bilik-antara-background.cjs"
      - ".github/workflows/bilik-antara-browser-audit.yml"
permissions:
  contents: read
concurrency:
  group: bilik-antara-browser-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Audit desktop/mobile, animations, glass, privacy UI, and keyboard
        env:
          BACKGROUND_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          python3 -m http.server 4177 --bind 127.0.0.1 > /tmp/aksara-audit-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -sf http://127.0.0.1:4177/bilik-antara.html > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-bilik-antara-browser.cjs
          node scripts/test-aksara-voice-v4-browser.cjs
          node scripts/test-aksara-voice-2d-browser.cjs
          node scripts/test-aksara-live2d-v03-browser.cjs
          node scripts/test-aksara-voice-v4-live-controls-browser.cjs
          node scripts/test-aksara-ui-polish-browser.cjs
          node scripts/test-thinking-mode-status-browser.cjs
          node scripts/test-six-observability-browser.cjs
          node scripts/test-session-memory-integrity-browser.cjs
          node scripts/test-knowledge-hub-browser.cjs
          node scripts/test-code-engine-browser.cjs
          node scripts/test-attachments-browser.cjs
          node scripts/test-multi-ai-status-browser.cjs
          node scripts/test-bilik-antara-background.cjs
      - name: Create and test standalone Code Engine HTML
        if: always()
        run: |
          node --check bilik-antara-code-runtime.js
          node --check scripts/build-code-engine-standalone.cjs
          node scripts/build-code-engine-standalone.cjs
          node scripts/test-code-engine-standalone.cjs
      - name: Upload manual Code Engine demo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aksara-code-engine-standalone
          path: code-engine-demo/AKSARA-Code-Engine-v0.1.html
          if-no-files-found: error
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilik-antara-desktop-mobile-visual
          path: browser-audit-artifacts/
          if-no-files-found: ignore
