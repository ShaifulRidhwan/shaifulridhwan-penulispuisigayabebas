name: Gaya Bebas Site Quality
on:
  pull_request:
    paths:
      - "index.html"
      - "_headers"
      - "netlify.toml"
      - "gaya-bebas.css"
      - "gaya-bebas.js"
      - "karya-data.js"
      - "karya-index.json"
      - "bilik-antara.html"
      - "scripts/test-site-quality.cjs"
      - "antara-cahaya-dan-gelap.html"
      - "assets/novel/pembaca.html"
      - "studio-antara.html"
      - "studio-antara*.js"
      - "studio-antara.css"
      - "netlify/functions/studio-*.js"
      - "netlify/functions/lib/studio-*.js"
      - "scripts/test-studio-*.cjs"
      - "package.json"
      - "package-lock.json"
      - "sitemap.xml"
      - "robots.txt"
      - "favicon-*.svg"
      - "favicon-*.png"
      - "*.webmanifest"
      - "scripts/test-site-metadata.cjs"
      - ".github/workflows/site-quality.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "_headers"
      - "netlify.toml"
      - "gaya-bebas.css"
      - "gaya-bebas.js"
      - "karya-data.js"
      - "karya-index.json"
      - "bilik-antara.html"
      - "scripts/test-site-quality.cjs"
      - "antara-cahaya-dan-gelap.html"
      - "assets/novel/pembaca.html"
      - "studio-antara.html"
      - "studio-antara*.js"
      - "studio-antara.css"
      - "netlify/functions/studio-*.js"
      - "netlify/functions/lib/studio-*.js"
      - "scripts/test-studio-*.cjs"
      - "package.json"
      - "package-lock.json"
      - "sitemap.xml"
      - "robots.txt"
      - "favicon-*.svg"
      - "favicon-*.png"
      - "*.webmanifest"
      - "scripts/test-site-metadata.cjs"
      - ".github/workflows/site-quality.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Studio quota and test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and editorial, SEO and archive checks
        run: |
          node --check gaya-bebas.js
          node --check karya-data.js
          node --check studio-antara-cloud.js
          node --check netlify/functions/studio-image.js
          npm run test:studio
          node --test scripts/test-site-quality.cjs
          node --test scripts/test-site-metadata.cjs
