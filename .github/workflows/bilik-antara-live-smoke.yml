name: Bilik Antara Production Smoke
on:
  workflow_dispatch:
  push:
    branches:
      - qa/bilik-antara-live-smoke-2026-10-26
    paths:
      - scripts/smoke-bilik-antara-live.cjs
      - .github/workflows/bilik-antara-live-smoke.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check smoke test syntax
        run: node --check scripts/smoke-bilik-antara-live.cjs
      - name: Probe Netlify, ask Gemini, test Live audio
        env:
          SKIP_GEMINI_TEXT: "1"
        run: node scripts/smoke-bilik-antara-live.cjs
