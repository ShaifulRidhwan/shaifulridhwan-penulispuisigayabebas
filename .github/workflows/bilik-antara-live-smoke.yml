name: Bilik Antara Production Smoke
on:
  workflow_dispatch:
    inputs:
      test_text:
        description: "Test Gemini text API too (consumes Google quota)"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check smoke test syntax
        run: node --check scripts/smoke-bilik-antara-live.cjs
      - name: Probe Netlify and test Gemini Live audio
        env:
          SKIP_GEMINI_TEXT: ${{ inputs.test_text && '0' || '1' }}
        run: node scripts/smoke-bilik-antara-live.cjs
