name: AKSARA Chess Android
on:
  push:
    branches: ['feat/aksara-chess-foundation']
    paths: ['android-native/chess-native/**', 'android-native/engine/chess/**', 'android-native/app/src/main/java/my/aksara/nativeapp/feature/chess/**', 'android-native/app/src/androidTest/java/my/aksara/nativeapp/ChessAndroidTest.kt', '.github/workflows/aksara-chess-android.yml']
  pull_request:
    paths: ['android-native/chess-native/**', 'android-native/engine/chess/**', 'android-native/app/src/main/java/my/aksara/nativeapp/feature/chess/**', 'android-native/app/src/androidTest/java/my/aksara/nativeapp/ChessAndroidTest.kt', '.github/workflows/aksara-chess-android.yml']
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: chess-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore verified Stockfish 19 build cache
        id: stockfish-cache
        uses: actions/cache@v4
        with:
          path: |
            android-native/app/src/main/jniLibs/arm64-v8a/libstockfish.so
            android-native/app/src/main/jniLibs/x86_64/libstockfish.so
            android-native/chess-native/build/stockfish-19-corresponding-source.tar.gz
          key: stockfish19-ndk27-linux-v1-${{ hashFiles('android-native/chess-native/build.sh', 'android-native/chess-native/stockfish/**', 'android-native/chess-native/README.md') }}
      - name: Build Stockfish 19 on cache miss
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager 'ndk;27.2.12479018'
          bash android-native/chess-native/build.sh | tee stockfish-build.txt
      - name: Record cached Stockfish build
        if: steps.stockfish-cache.outputs.cache-hit == 'true'
        run: echo 'Stockfish 19 binaries and source restored from checksum-keyed cache' | tee stockfish-build.txt
      - name: Unit regression and APK build
        working-directory: android-native
        run: gradle --no-daemon :engine:chess:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Hash and identify deliverables
        run: |
          sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk android-native/chess-native/build/stockfish-19-corresponding-source.tar.gz > SHA256SUMS
          printf 'source_commit=%s\ntested_commit=%s\nrun=%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' '${{ github.sha }}' '${{ github.run_id }}' > BUILD.txt
      # Source is an inseparable companion download to the debug APK.
      - uses: actions/upload-artifact@v4
        with:
          name: aksara-chess-corresponding-source
          path: |
            android-native/chess-native/build/stockfish-19-corresponding-source.tar.gz
            android-native/chess-native/README.md
            stockfish-build.txt
            SHA256SUMS
            BUILD.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: aksara-chess-debug-apk
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            SHA256SUMS
            BUILD.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aksara-chess-unit-reports
          path: |
            android-native/app/build/reports/tests/
            android-native/engine/chess/build/reports/tests/
  android-runtime:
    # Optional device-emulator diagnostic; PR merge is gated by build/unit tests.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aksara-chess-debug-apk
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash android-native/ci/chess-runtime.sh artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aksara-chess-android-evidence
          path: chess-evidence/
          overwrite: true
