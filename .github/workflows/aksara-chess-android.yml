name: AKSARA Chess Android
on:
  push:
    branches: ['feat/aksara-chess-foundation']
    paths: ['android-native/**', '.github/workflows/aksara-chess-android.yml']
  pull_request:
    paths: ['android-native/**', '.github/workflows/aksara-chess-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chess-android-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Build official Stockfish 19 Android PIE and corresponding source
        run: bash android-native/chess-native/build.sh | tee stockfish-build.txt
      - name: Unit regression and APK build
        working-directory: android-native
        run: gradle --no-daemon :engine:chess:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Hash and identify deliverables
        run: |
          sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk android-native/chess-native/build/stockfish-19-corresponding-source.tar.gz > SHA256SUMS
          printf 'commit=%s\nrun=%s\n' '${{ github.sha }}' '${{ github.run_id }}' > BUILD.txt
      # Source is an inseparable companion download to the debug APK.
      - uses: actions/upload-artifact@v4
        with:
          name: aksara-chess-corresponding-source
          path: |
            android-native/chess-native/build/stockfish-19-corresponding-source.tar.gz
            android-native/chess-native/README.md
            stockfish-build.txt
            SHA256SUMS
            BUILD.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: aksara-chess-debug-apk
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            SHA256SUMS
            BUILD.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aksara-chess-unit-reports
          path: |
            android-native/app/build/reports/tests/
            android-native/engine/chess/build/reports/tests/
  android-runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aksara-chess-debug-apk
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash android-native/ci/chess-runtime.sh artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aksara-chess-android-evidence
          path: chess-evidence/
