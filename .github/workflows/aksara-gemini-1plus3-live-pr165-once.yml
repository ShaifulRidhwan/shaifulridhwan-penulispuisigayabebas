name: AKSARA Gemini 1+3 live PR165 diagnostic
on:
  push:
    branches:
      - fix/gemini-1plus3-health-and-rollback-20261102
    paths:
      - .github/workflows/aksara-gemini-1plus3-live-pr165-once.yml
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test real deployed Worker with one ordinary unforced chat
        run: |
          node --input-type=module <<'NODE'
          const origin="https://aksara-apps.mshaifulridhwan.workers.dev";
          async function request(path,body){
            const r=await fetch(origin+path,{method:"POST",
              headers:{"Origin":origin,"Content-Type":"application/json"},
              body:JSON.stringify(body),signal:AbortSignal.timeout(35000)});
            const j=await r.json().catch(()=>({}));
            return {http:r.status,j};
          }
          const health=await fetch(origin+"/api/aksara-health",{signal:AbortSignal.timeout(12000)});
          const healthBody=await health.json().catch(()=>({}));
          console.log("WORKER",JSON.stringify({http:health.status,chat:healthBody.services?.chat,configuredProviders:healthBody.configuredProviders}));
          const before=await request("/.netlify/functions/bilik-antara",{providerStatus:true});
          console.log("STATUS_BEFORE",JSON.stringify({http:before.http,gemini:before.j.providers?.find(p=>p.id==="gemini")||null,preferred:before.j.preferredProvider||null}));
          const chat=await request("/.netlify/functions/bilik-antara",{
            question:"Terangkan secara ringkas apa itu metafora dalam satu ayat.",
            history:[],thoughtMode:"cahaya"
          });
          const data=chat.j||{};
          console.log("ORDINARY_CHAT",JSON.stringify({http:chat.http,provider:data.provider||null,model:data.model||null,
            hasReply:typeof data.reply==="string"&&data.reply.trim().length>0,
            code:data.code||null,geminiDiagnosis:data.routing?.geminiDiagnosis||null,
            failedAttempts:(data.routing?.failedAttempts||data.providerFailures||[]).map(f=>({provider:f.provider,status:f.status,reason:f.reason,quotaKind:f.quotaKind}))}));
          const after=await request("/.netlify/functions/bilik-antara",{providerStatus:true});
          console.log("STATUS_AFTER",JSON.stringify({http:after.http,gemini:after.j.providers?.find(p=>p.id==="gemini")||null,preferred:after.j.preferredProvider||null}));
          if(health.status!==200||chat.http!==200||data.provider!=="gemini"||!data.reply)process.exitCode=1;
          NODE