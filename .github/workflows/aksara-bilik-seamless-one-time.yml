# Temporary, branch-scoped one-time video re-encode. Remove before merge to main.
name: AKSARA Bilik seamless loop one-time render
on:
  push:
    branches:
      - fix/bilik-seamless-loop-stabilizer-20261101
    paths:
      - .github/workflows/aksara-bilik-seamless-one-time.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render one-second tail-to-head overlap at native 16 FPS
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          test "$(git hash-object bilik-antara-background.mp4)" = ef0046d3728cd64a076f7fae5c85a05bacfdd04c
          ffmpeg -hide_banner -loglevel error -y -i bilik-antara-background.mp4 \
            -filter_complex '[0:v]fps=16,split=3[midSrc][tailSrc][headSrc];[midSrc]trim=start_frame=16:end_frame=146,setpts=PTS-STARTPTS,fps=16[mid];[tailSrc]trim=start_frame=146:end_frame=162,setpts=PTS-STARTPTS,fps=16[tail];[headSrc]trim=start_frame=0:end_frame=16,setpts=PTS-STARTPTS,fps=16[head];[tail][head]xfade=transition=fade:duration=1:offset=0[blend];[mid][blend]concat=n=2:v=1:a=0,format=yuv420p[out]' \
            -map '[out]' -an -c:v libx264 -preset medium -crf 22 -movflags +faststart /tmp/bilik-seamless.mp4
          node -e 'const cp=require("child_process"),fs=require("fs");const f="/tmp/bilik-seamless.mp4";const p=JSON.parse(cp.execFileSync("ffprobe",["-v","error","-show_entries","stream=codec_name,width,height,r_frame_rate,nb_frames","-show_entries","format=duration,size","-of","json",f]));const s=p.streams[0],d=Number(p.format.duration);if(s.codec_name!=="h264"||s.width!==480||s.height!==832||s.r_frame_rate!=="16/1"||s.nb_frames!=="146"||Math.abs(d-9.125)>0.07||fs.statSync(f).size>1200000)process.exit(1);console.log("VIDEO LOOP PASS",d+"s",fs.statSync(f).size+" bytes")'
          mv /tmp/bilik-seamless.mp4 bilik-antara-background.mp4
      - name: Commit only encoded video to the experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bilik-antara-background.mp4
          git diff --cached --quiet && { echo "No new video"; exit 1; }
          git commit -m "fix(video): seamless tail-to-head crossfade at native frame rate"
          git push origin HEAD:fix/bilik-seamless-loop-stabilizer-20261101
