name: AKSARA Live2D Rigging Research (Draft)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aksara-live2d-quality-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  layered-psd:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build genuine named-layer PSD source
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
          python scripts/build-aksara-live2d-quality-v05.py --source bilik-antara-avatar-2d-art.webp --output build/live2d/aksara-celestial-layered-draft.psd
          python - <<'PY'
          from pathlib import Path
          p=Path('build/live2d/aksara-celestial-layered-draft.psd')
          b=p.read_bytes()
          assert b[:4]==b'8BPS' and len(b)>100_000
          assert all(x in b for x in (b'irides-l',b'irides-r',b'mouth inside',b'upper eyelid',b'upper lip',b'headwear sun',b'headwear moon'))
          print('PSD header, names and bytes verified',len(b))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aksara-celestial-layered-psd-draft
          path: |
            build/live2d/aksara-celestial-layered-draft.psd
            build/live2d/parts/manifest.json
            build/live2d/parts/accessories/*.png
            build/live2d/parts/accessories/accessories.json
          if-no-files-found: error
  auto-rig-probe:
    runs-on: ubuntu-latest
    needs: layered-psd
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: aksara-site
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aksara-celestial-layered-psd-draft
          path: aksara-site/build/live2d
      - uses: actions/checkout@v4
        with:
          repository: tsunehimatoi/psd2live
          ref: c895a10ee6f3a1a1d58b9be5195f6443d7a2bb43
          path: psd2live-tool
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate .moc3 compatibility proof with external PSD2Live
        working-directory: psd2live-tool
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Ppsd2live.prebuiltRuntime=false run --args="--input ../aksara-site/build/live2d/aksara-celestial-layered-draft.psd --output ../aksara-site/build/live2d/auto-rig --lang en --atlas 4096"
      - name: Check rig export files
        if: success()
        run: |
          find aksara-site/build/live2d/auto-rig -type f | sort | head -n 60
          python - <<'PY'
          from pathlib import Path
          root=Path('aksara-site/build/live2d/auto-rig')
          assert list(root.rglob('*.moc3')), 'No actual .moc3 export found'
          assert list(root.rglob('*.model3.json')), 'No .model3.json export found'
          print('Automatic rig output exists; visual review is still required')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aksara-live2d-autorig-experiment
          path: aksara-site/build/live2d/auto-rig/
          if-no-files-found: warn
  publish-experiment:
    needs: [layered-psd, auto-rig-probe]
    # Only this one trusted, owned experiment branch receives write access.
    # The third-party auto-rigger runs in its own read-only job.
    if: (github.event_name == 'workflow_dispatch' && github.ref_name == 'experiment/aksara-voice-anime-2d-v1') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/aksara-voice-anime-2d-v1')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/aksara-voice-anime-2d-v1
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: aksara-live2d-autorig-experiment
          path: /tmp/aksara-autorig-model
      - uses: actions/download-artifact@v4
        with:
          name: aksara-celestial-layered-psd-draft
          path: /tmp/aksara-psd-v05
      - name: Validate and stage actual exported Cubism rig
        run: |
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          root=Path("assets/live2d/aksara")
          exported=Path("/tmp/aksara-autorig-model")
          files=list(exported.rglob("*.model3.json"))
          assert len(files)==1,files
          data=json.loads(files[0].read_text())
          refs=data["FileReferences"]
          source=files[0].parent
          assert refs["Moc"].endswith(".moc3")
          assert ".4096/" in refs["Textures"][0],refs["Textures"]
          names=[refs["Moc"],*refs["Textures"],refs["Physics"],refs["DisplayInfo"]]
          names += [x["File"] for x in refs.get("Expressions",[])]
          names += [x["File"] for motions in refs.get("Motions",{}).values() for x in motions]
          for name in names:assert (source/name).is_file() and (source/name).stat().st_size>20,name
          assert (source/refs["Moc"]).stat().st_size>1_000_000
          assert (source/refs["Textures"][0]).stat().st_size>500_000
          # Only after fully validated: replace the old runtime model.
          for old in root.glob("*.2048"):
              if old.is_dir():shutil.rmtree(old)
          for name in names:
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(source/name,target)
          shutil.copy2(files[0],root/"aksara.model3.json")
          props=Path("/tmp/aksara-psd-v05/parts/accessories")
          assert (props/"accessories.json").is_file()
          for file in props.iterdir():
              if file.is_file():
                  target=root/"accessories"/file.name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(file,target)
          print("Validated rig files",len(names),"plus isolated accessories",list((root/"accessories").iterdir()))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm runtime renders new Cubism rig before publishing
        run: |
          set -euo pipefail
          node --test tests/aksara-live2d-v04.test.cjs tests/aksara-live2d-v05.test.cjs
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4177 --bind 127.0.0.1 >/tmp/aksara-rig-v05-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5;do
            if curl -fsS http://127.0.0.1:4177/bilik-antara.html >/dev/null;then break;fi
            sleep 1
          done
          node scripts/test-aksara-live2d-v03-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aksara-live2d-v05-post-rig-visual
          path: browser-audit-artifacts/aksara-live2d-v05-*.png
          if-no-files-found: warn
      - name: Push quality rig only into experimental PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live2d/aksara
          if git diff --cached --quiet;then echo "Rig already up to date";exit 0;fi
          git commit -m "feat(live2d-v05): install 4096 high fidelity Cubism rig with clean face layers and accessory sprites"
          git pull --rebase origin experiment/aksara-voice-anime-2d-v1
          git push origin HEAD:refs/heads/experiment/aksara-voice-anime-2d-v1
