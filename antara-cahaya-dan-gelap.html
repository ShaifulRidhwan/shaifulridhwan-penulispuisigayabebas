<style>

*{margin:0;padding:0;box-sizing:border-box}

/* ===== COVER ===== */
.cover{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 1.5rem;overflow:hidden}

.cover-eyebrow{font-family:var(--font-ui);font-size:.6rem;letter-spacing:.4em;text-transform:uppercase;color:var(--accent);margin-bottom:1.6rem}

.cover-cta{display:inline-flex;align-items:center;gap:.7rem;font-family:var(--font-ui);font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:1rem 2.2rem;border-radius:2px;transition:all .3s}
.cover-cta:hover{background:var(--accent);color:var(--bg);transform:translateY(-2px)}

.cover-resume{display:block;margin-top:1.1rem;font-family:var(--font-ui);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);background:none;border:none}

/* ===== READER VIEW (book) ===== */
.reader{display:none;min-height:100vh;min-height:100svh;flex-direction:column}

.book-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:.4rem .2rem;position:relative;overflow:hidden;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.book{position:relative;perspective:2200px}
.spread{display:flex;gap:0;position:relative}
.page{position:relative;background:var(--page-bg);background-image:var(--grain);border:1px solid var(--hairline);box-shadow:var(--shadow);overflow:hidden;flex-shrink:0;display:flex;flex-direction:column}
.page.left{border-radius:3px 0 0 3px}

.page.single{border-radius:3px}
.page.spine::after{content:"";position:absolute;top:0;bottom:0;right:0;width:1px;background:linear-gradient(180deg,transparent,var(--page-edge),transparent);pointer-events:none}
.page.right::before{content:"";position:absolute;top:0;bottom:0;left:0;width:1px;background:linear-gradient(180deg,transparent,var(--page-edge),transparent);pointer-events:none}
.page-inner{flex:1;padding:var(--pad);overflow:hidden;position:relative}
.page-folio{flex-shrink:0;text-align:center;font-family:var(--font-ui);font-size:.56rem;letter-spacing:.22em;color:var(--text-faint);padding:.5rem 0 .7rem;text-transform:uppercase}

.page-inner p.drop::first-letter{font-family:var(--font-display);font-weight:600;font-size:2.6em;line-height:.8;float:left;padding:.04em .08em 0 0;color:var(--accent)}
.page-inner .novel-quote{margin:1.8em 0;padding:1.1em 1.3em 1.1em 1.5em;border-left:2.5px solid var(--accent);background:var(--accent-soft);border-radius:0 3px 3px 0;font-family:var(--font-display);font-style:italic;color:var(--text);font-size:1.08em;line-height:1.65;font-weight:400;position:relative}
.page-inner .novel-quote p{margin-bottom:0;text-align:left}
.page-inner .scene-break{display:flex;align-items:center;justify-content:center;gap:.8rem;margin:1em 0;color:var(--text-faint)}
.page-inner .scene-break span{height:1px;flex:1;max-width:2rem;background:var(--hairline)}
.page-inner .scene-break .dot{flex:0 0 auto;background:none;max-width:none;color:var(--accent);opacity:.6;font-size:.8rem}
.page-blank{background:transparent;border:none;box-shadow:none}
.page-blank .page-inner{display:none}
.page-blank .page-folio{display:none}

/* Flipper */
.flipper{position:absolute;top:0;z-index:50;transform-style:preserve-3d;pointer-events:none;display:none}
.flipper.active{display:block}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--page-bg);background-image:var(--grain);border:1px solid var(--hairline);overflow:hidden;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg)}
.flipper.turn-next{transition:transform .55s cubic-bezier(.4,.1,.3,1)}
.flipper.turn-prev{transition:transform .55s cubic-bezier(.4,.1,.3,1)}
.flipper.turn-next.do{transform:rotateY(-180deg)}
.flipper.turn-prev.do{transform:rotateY(180deg)}
@media(prefers-reduced-motion:reduce){.flipper.turn-next,.flipper.turn-prev{transition:none}}

/* Click zones */
.click-zone{position:absolute;top:0;bottom:0;width:22%;z-index:40;cursor:pointer}
.click-zone.prev{left:0}
.click-zone.next{right:0}

/* Bottom controls */
.book-controls{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.7rem 1rem 1.1rem;border-top:1px solid var(--hairline);max-width:900px;margin:0 auto;width:100%}
.nav-btn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--font-ui);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:.7rem 1.3rem;border-radius:2px;transition:all .25s}
.nav-btn:hover:not(:disabled){background:var(--accent);color:var(--bg)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.page-indicator{font-family:var(--font-ui);font-size:.66rem;letter-spacing:.12em;color:var(--text-muted);text-align:center;flex:1}
.page-indicator b{color:var(--accent);font-weight:600}

/* TOC panel */
.toc-overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(2px)}
.toc-overlay.open{opacity:1;pointer-events:auto}
.toc-panel{position:fixed;top:0;left:0;bottom:0;z-index:160;width:min(22rem,88vw);background:var(--bg-soft);border-right:1px solid var(--border);transform:translateX(-105%);transition:transform .38s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.toc-panel.open{transform:translateX(0)}
.toc-head{display:flex;align-items:center;justify-content:space-between;padding:1.3rem 1.4rem;border-bottom:1px solid var(--hairline)}
.toc-head h3{font-family:var(--font-display);font-size:1.1rem;font-weight:600}
.toc-head span{display:block;font-family:var(--font-ui);font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint);margin-top:.2rem}
.toc-list{flex:1;overflow-y:auto;padding:.8rem 0}
.toc-link{display:flex;align-items:baseline;gap:.9rem;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--hairline);padding:.85rem 1.4rem;color:var(--text);font-family:var(--font-display);transition:all .2s}
.toc-link:hover{background:var(--accent-soft);color:var(--accent);padding-left:1.6rem}
.toc-num{font-family:var(--font-ui);font-size:.66rem;color:var(--text-faint);flex-shrink:0;min-width:1.6rem}
.toc-title{font-size:.92rem;line-height:1.4;font-weight:500;flex:1;text-align:left}
.toc-page{font-family:var(--font-ui);font-size:.62rem;color:var(--text-faint);flex-shrink:0}
.toc-foot{padding:1.1rem 1.4rem;border-top:1px solid var(--hairline);display:flex;flex-direction:column;gap:.8rem}
.toc-foot a,.toc-foot button{font-family:var(--font-ui);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);background:none;border:none;display:inline-flex;align-items:center;gap:.5rem;padding:0;text-align:left}
.toc-foot a:hover,.toc-foot button:hover{opacity:.7}

/* Measurer (hidden) */
#measurer{position:fixed;left:-9999px;top:0;visibility:hidden;overflow:hidden;font-family:var(--font-body);line-height:1.62;font-weight:400}
#measurer p{margin-bottom:.65em;text-align:justify}
#measurer .novel-quote{margin:1.8em 0;padding:1.1em 1.3em 1.1em 1.5em;border-left:2.5px solid var(--accent);background:var(--accent-soft);border-radius:0 3px 3px 0;font-family:var(--font-display);font-style:italic;color:var(--text);font-size:1.08em;line-height:1.65;font-weight:400}
#measurer .novel-quote p{margin-bottom:0;text-align:left}

#measurer .scene-break .dot{flex:0 0 auto;background:none;max-width:none;color:var(--accent);opacity:.6;font-size:.8rem}

#measurer .ps-eyebrow{font-family:var(--font-ui);font-size:.55rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
#measurer .ps-rule{display:flex;align-items:center;gap:.8rem;margin-bottom:.9rem;color:var(--accent);font-size:.6rem;opacity:.7}
#measurer .ps-rule::before,#measurer .ps-rule::after{content:"";height:1px;flex:1;max-width:2.5rem;background:var(--hairline)}

/* Continuous fallback mode */
.continuous{max-width:66ch;margin:0 auto;padding:3rem 1.5rem 4rem}
body.in-book .continuous{display:none}
body.continuous-mode .book-stage,body.continuous-mode .book-controls,body.continuous-mode .topbar{display:none}
body.continuous-mode .continuous{display:block}
body.continuous-mode .reader{display:block}
.book-section{margin-bottom:3.5rem}
.book-section-title{font-family:var(--font-display);font-weight:500;font-size:clamp(1.5rem,4vw,2.2rem);text-align:center;margin-bottom:2rem}
.continuous p{margin-bottom:1.1em;text-align:justify;hyphens:auto;font-weight:300}
.continuous .novel-quote{margin:2rem 0;padding:1.2rem 1.4rem 1.2rem 1.6rem;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 4px 4px 0;font-family:var(--font-display);font-style:italic;color:var(--text);font-size:1.15em;line-height:1.75;font-weight:400}
.continuous .scene-break{display:flex;align-items:center;justify-content:center;gap:1rem;margin:2.5rem 0;color:var(--text-faint)}
.continuous .scene-break span{height:1px;flex:1;max-width:4rem;background:var(--hairline)}
.continuous .scene-break .dot{flex:0 0 auto;background:none;max-width:none;color:var(--accent);opacity:.6}
.continuous-end{text-align:center;padding:3rem 1.5rem;font-family:var(--font-display);font-style:italic;color:var(--text-muted)}

.back-top{position:fixed;bottom:1.2rem;right:1.2rem;z-index:90;width:2.5rem;height:2.5rem;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--accent);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:all .3s;box-shadow:var(--shadow)}
.back-top.visible{opacity:1;pointer-events:auto}

@media(max-width:640px){
