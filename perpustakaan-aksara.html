const key="aksara-library-bookmarks-v1";let saved=new Set();
try{const raw=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(raw))saved=new Set(raw.filter(x=>typeof x==="string").slice(0,1000))}catch(_){}
const el=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(key,JSON.stringify(Array.from(saved)))}catch(_){}}
function saveButton(id){const b=document.createElement("button");b.type="button";b.className="bookmark";b.dataset.id=id;b.textContent=saved.has(id)?"★":"☆";b.setAttribute("aria-label",saved.has(id)?"Buang daripada simpanan":"Simpan buku");b.setAttribute("aria-pressed",saved.has(id)?"true":"false");b.addEventListener("click",()=>{if(saved.has(id))saved.delete(id);else saved.add(id);persist();render();});return b}
function bookCard(b){
 const [id,title,author,lang,genre,description,url,c1,c2,cta,cover]=b;
 const card=document.createElement("article");card.className="book";
 const art=document.createElement("a");art.className="art";art.style.setProperty("--c1",c1||"#28343c");art.style.setProperty("--c2",c2||"#11151d");art.href=url;if(id!=="aksara-original"){art.target="_blank";art.rel="noopener noreferrer";}art.setAttribute("aria-label","Buka "+title);
 const ornament=document.createElement("div");ornament.className="ornament";
 const placeholder=document.createElement("span");placeholder.className="initial";placeholder.textContent=title;art.append(ornament,placeholder);
 const images=cover?[cover]:(COVER_MAP[id]||[]);
 const allowed=u=>{try{const p=new URL(u,window.location.href);return (p.protocol==="https:"&&["www.gutenberg.org","covers.openlibrary.org"].includes(p.hostname))||(p.origin===window.location.origin&&p.pathname.endsWith("/assets/novel/cover-01.jpg"))}catch(e){return false}};
 if(images.length){
  const img=document.createElement("img");img.alt="";img.loading="lazy";img.decoding="async";img.referrerPolicy="no-referrer";
  let i=0;const next=()=>{while(i<images.length&&!allowed(images[i]))i++;if(i>=images.length){img.remove();return}img.src=new URL(images[i++],window.location.href).href;};
  img.addEventListener("error",next);art.append(img);next();
 }
 const info=document.createElement("div");info.className="book-info";
 const tag=document.createElement("span");tag.className="tag";tag.textContent=(lang==="ms"?"Melayu":lang==="id"?"Indonesia":"English")+" · "+(genre==="falsafah"?"Falsafah":genre==="hikayat"?"Hikayat":"Novel");
 const h=document.createElement("h3");const titleLink=document.createElement("a");titleLink.className="book-title-link";titleLink.href=url;if(id!=="aksara-original"){titleLink.target="_blank";titleLink.rel="noopener noreferrer";}titleLink.textContent=title;h.append(titleLink);
 const writer=document.createElement("p");writer.className="writer";writer.textContent=author;
 const desc=document.createElement("p");desc.className="description";desc.textContent=description;
 const foot=document.createElement("div");foot.className="foot";const link=document.createElement("a");link.href=url;link.textContent=cta||"Buka sumber ↗";if(id!=="aksara-original"){link.target="_blank";link.rel="noopener noreferrer";}
 foot.append(link,saveButton(id));info.append(tag,h,writer,desc,foot);card.append(art,info);return card
}

 el("books").replaceChildren(...DATA.map(b=>bookCard(b)));
}
