</style></head><body><div class="shell"><div class="world-scene" aria-hidden="true"><div class="world-art"></div></div></div><script>/* AKSARA Living Background v0.8. Solar attack synced to v0.4 gown peak; moon/hair locked v0.6. */
(()=>{
 'use strict';
 const scene=document.querySelector('.world-scene');if(!scene||scene.querySelector('.living-frame'))return;
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
 const connection=navigator.connection,voicePanel=document.getElementById('voicePanel');
 const layers=document.createElement('div');layers.className='living-frame';layers.setAttribute('aria-hidden','true');
 for(const name of ['sun','sun-halo','moon','moon-halo','force-gold','force-blue','clash','gown-gold','gown-blue','veil-gold','veil-blue','hair-mesh-outer','hair-mesh-inner','moon-physical','sun-plasma','solar-orb','solar-tide-a','solar-tide-b','solar-impact']){
  const layer=document.createElement('div');layer.className='living-layer living-'+name;layers.append(layer);
 }
 scene.append(layers);
 function sync(){
  const voiceBusy=document.body.classList.contains('voice-focus')||(voicePanel&&!voicePanel.hidden);
  scene.classList.toggle('living-active',!document.hidden&&!reduced.matches&&!connection?.saveData&&!voiceBusy&&document.documentElement.dataset.livingPaused!=='true');
 }
 const observer=new MutationObserver(sync);
 observer.observe(document.body,{attributes:true,attributeFilter:['class']});
 if(voicePanel)observer.observe(voicePanel,{attributes:true,attributeFilter:['hidden','class']});
 observer.observe(document.documentElement,{attributes:true,attributeFilter:['data-living-paused']});
 document.addEventListener('visibilitychange',sync);
 if(reduced.addEventListener)reduced.addEventListener('change',sync);else reduced.addListener?.(sync);
 connection?.addEventListener?.('change',sync);
 window.addEventListener('pagehide',()=>scene.classList.remove('living-active'));
 window.addEventListener('pageshow',sync);sync();
})();
</script></body></html>
